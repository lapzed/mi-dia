<style>
  :root{
    --bg:#0B2038; --bg2:#0E2A47; --card:#12314F; --line:#1D4267;
    --txt:#EAF2FB; --txt2:#9DB6D2; --txt3:#6E8CAD;
    --acc:#63B3FF; --ok:#1E8E5A; --warn:#E8A33D; --bad:#C6413B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);line-height:1.45;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1320px;margin:0 auto;padding:0 16px 70px}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0B2038,#0E2A47);
    border-bottom:1px solid var(--line);padding:12px 16px;margin:0 -16px 14px}
  .brand{display:flex;align-items:center;gap:11px;max-width:1320px;margin:0 auto}
  .bt{font-size:17px;font-weight:800}
  .bs{font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.05em}
  .who{margin-left:auto;text-align:right;font-size:11px;color:var(--txt2);cursor:pointer}
  .who b{display:block;color:var(--txt);font-size:12px}

  .barra{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em}
  select,input,textarea{padding:8px 9px;border-radius:9px;background:#0F2C4A;color:var(--txt);
    border:1px solid var(--line);font:inherit;font-size:13px}
  button{font:inherit;border:none;border-radius:10px;padding:9px 14px;font-size:13px;
    font-weight:700;cursor:pointer;background:#17456E;color:var(--acc)}
  button.pri{background:var(--acc);color:#07203a}
  .mini{padding:4px 9px;font-size:11.5px}


  /* ---- barra de etapas: moverse por el flujo sin volver al inicio ---- */
  .etapas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px;
    font-size:12.5px}
  .etapas a{display:flex;align-items:center;gap:6px;text-decoration:none;
    color:var(--txt2);background:#0F2C4A;border:1px solid var(--line);
    border-radius:10px;padding:7px 11px;white-space:nowrap}
  .etapas a:hover{color:var(--txt);background:#17456E}
  .etapas a.aqui{background:var(--acc);color:#07203a;border-color:var(--acc);font-weight:700}
  .etapas .fl{color:var(--txt3);font-size:11px}
  .etapas .paso{padding:7px 11px;font-size:12px;background:#17456E;color:var(--acc);
    border-radius:10px}
  .etapas .paso:disabled{opacity:.35}
  .etapas select{padding:6px 9px;font-size:12px;width:auto;border-radius:10px}
  .etapas .ini{margin-left:auto}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt2);
    text-transform:none;letter-spacing:0;cursor:pointer;white-space:nowrap}
  .chk input{width:auto;margin:0}
  .avisoAtoro{background:rgba(198,65,59,.10);border:1px solid rgba(198,65,59,.42);
    border-radius:13px;padding:12px 14px;margin-bottom:13px;font-size:13px}
  .avisoAtoro b{color:#F0A9A5}
  .avisoAtoro .dd{font-weight:800;font-variant-numeric:tabular-nums}
  .avisoAtoro .rojo{color:#F0A9A5} .avisoAtoro .ambar{color:#F0BE6E}
  /* ---- cinta de cumplimiento ---- */
  .cinta{display:flex;align-items:center;gap:11px;flex-wrap:wrap;border-radius:12px;
    padding:10px 14px;margin-bottom:13px;font-size:13px;border:1px solid}
  .cinta.verde{background:rgba(30,142,90,.13);border-color:rgba(30,142,90,.45);color:#9EE7C2}
  .cinta.ambar{background:rgba(232,163,61,.11);border-color:rgba(232,163,61,.45);color:#F5CE93}
  .cinta.rojo{background:rgba(198,65,59,.12);border-color:rgba(198,65,59,.45);color:#F3B0AC}
  .cinta .foco{font-size:19px;line-height:1}
  .cinta b{font-weight:800}
  .cinta .det{color:var(--txt2);font-size:12px}
  .cinta a{margin-left:auto;color:inherit;font-weight:700;text-decoration:none;
    border-bottom:1px dotted currentColor;font-size:12.5px}
  /* avance de obra: lo del instalador y lo que confirma coordinacion */
  .av{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .av .pl{font-size:11px;color:var(--txt3)}
  .av b{font-variant-numeric:tabular-nums}
  .av .atras{color:#F0A9A5} .av .bien{color:#7BE0AE}
  .av input{width:62px;padding:4px 6px;font-size:12px}
  .hallados{background:var(--card);border:1px solid var(--acc);border-radius:13px;
    padding:12px 14px;margin-bottom:13px}
  .hallados h3{margin:0 0 8px;font-size:13px;color:var(--acc);
    text-transform:uppercase;letter-spacing:.05em}
  .hallados table{min-width:640px}
  .hallados .ir{cursor:pointer;color:var(--acc);font-weight:700}
  .corregir{display:inline-block;color:var(--acc);text-decoration:none;
    font-size:11.5px;font-weight:700;white-space:nowrap}
  .corregir:hover{text-decoration:underline}
  /* ---- cierre en lote ---- */
  .selcol{width:34px;text-align:center}
  .selcol input{width:16px;height:16px;cursor:pointer;accent-color:var(--acc)}
  .lote{position:sticky;top:64px;z-index:15;display:none;gap:9px;flex-wrap:wrap;
    align-items:flex-end;background:#14395C;border:1px solid var(--acc);
    border-radius:13px;padding:11px 14px;margin-bottom:12px}
  .lote.on{display:flex}
  .lote .cuenta{font-size:14px;font-weight:800;align-self:center}
  .lote .cuenta b{color:var(--acc);font-size:19px}
  .lote textarea{min-width:230px;height:36px;padding:8px 9px;border-radius:9px;
    background:#0F2C4A;color:var(--txt);border:1px solid var(--line);
    font:inherit;font-size:13px;resize:vertical}
  .lote .aviso{font-size:11.5px;color:var(--txt2);align-self:center}
  .resumen{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:7px 13px;font-size:12px}
  .pill b{font-size:17px;display:block}

  .tabla{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1060px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--txt2);padding:8px 9px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--card)}
  td{padding:6px 9px;border-bottom:1px solid rgba(29,66,103,.45);vertical-align:top}
  td select,td input{padding:5px 7px;font-size:12px}
  .sitio{font-weight:600}
  .sub{font-size:11px;color:var(--txt3)}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:#17456E;color:var(--acc);white-space:nowrap}
  .ev{font-size:11px;white-space:nowrap}
  .ev .si{color:#5BD79B} .ev .no{color:#F0BE6E}
  .nota{width:100%;min-height:32px;font-size:12px;resize:vertical}
  .guardado{color:#5BD79B;font-size:11px}
  .fallo{color:#F0A9A5;font-size:11px}
  tr.viejo td{background:rgba(198,65,59,.07)}
  .dias{font-weight:700}

  .vacio{text-align:center;color:var(--txt2);padding:46px}
  .load{text-align:center;color:var(--txt2);padding:36px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(5,16,28,.95);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;
    padding:20px;max-width:390px;width:100%}
  .box h2{margin:0 0 3px;font-size:17px}
  .box p{margin:0 0 12px;font-size:12.5px;color:var(--txt2)}
  .box input,.box select{width:100%;margin-bottom:11px}
  .aviso{background:rgba(198,65,59,.14);border:1px solid rgba(198,65,59,.4);color:#F0A9A5;
    border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:11px}
  /* Un error del servidor llega como una cadena larga sin espacios
     -{"code":"PGRST301","details":...}- y sin espacios el navegador no tiene
     donde partirla: empuja la caja y corre la pagina de lado. Esto le da
     permiso de partir donde sea, que es feo pero se lee; lo otro no se lee. */
  .aviso,.vacio,.load,.sub,.q,.dat-nota{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">

</div>

  <div class="box">
    <h2>Cierre de servicios</h2>

    <select id="inUsr">

<script>
  /* Se esconde el recuadro de la clave ANTES del primer pintado, cuando ya hay
     sesion guardada. Comprobar si sirve es un viaje a la red, y mientras tanto
     se alcanzaba a ver la pantalla de entrar al saltar de una etapa a otra.
     Si al comprobarla resulta que ya no vale, el arranque la vuelve a mostrar
     con su aviso. */
  try{
    if(localStorage.getItem("md_cierre") || localStorage.getItem("md_web"))
      document.getElementById("mLogin").style.display = "none";
  }catch(e){}
</script>


<script>
const SUPA_URL="https://buwoxejgnmyvshwznbaj.supabase.co";
const SUPA_KEY="sb_publishable_Pts8K36Tj4vZ7UzSAwwicw_K6I11-Aw";
const DOMINIO="mdcontrol.local";
const BUCKET="evidencias";

/* Cada coordinador abre en la suya; gerencia y subgerencia ven todas. Es lo
   mismo que su rol en la estación: INTEGRAL sobre su coordinación. */
const SUYA={"est.jair":"Jair","est.alin":"Alin","est.ariana":"Ariana",
            "est.proyectos":"Karina","ext.possam":"Possam","ext.sore":"Sore","est.ximena":"Ximena","est.jocelyn":"Jocelyn","est.ivan":"Iván","est.patricia":"Patricia",
            "est.jenifer":"Jenifer"};

const LLAVES_SESION=["md_capt", "md_prog", "md_coord", "md_cierre", "md_cat", "md_lev", "md_sup", "md_ventas", "md_demanda", "md_ses", "md_web", "md_tec"];

/* ---------- la sesion guardada caduca ----------
   Antes no caducaba nunca: un equipo que nadie cerraba quedaba abierto para
   siempre, y quien lo tomara escribia con el nombre del dueno. Ahora se anota
   cuando se uso por ultima vez y a los 15 dias se pide la clave otra vez. */
const DIAS_SESION = 15;
function sesionVigente(s){
  if(!s) return null;
  if(s.visto && (Date.now() - s.visto) > DIAS_SESION*86400000) return null;
  return s;
}
function marcarUso(){
  try{
    if(!ses) return;
    ses.visto = Date.now();
    LLAVES_SESION.forEach(function(k){
      if(localStorage.getItem(k)) localStorage.setItem(k, JSON.stringify(ses));
    });
  }catch(e){}
}

let ses=sesionVigente(JSON.parse(localStorage.getItem("md_cierre")||
  localStorage.getItem("md_web")||"null"))   /* la sesion es una sola: ver md_web abajo */;
let filas=[], atorados=[], totalAtorados=0, EV={}, CAT={};

function hdr(extra){ return Object.assign({apikey:SUPA_KEY,
  Authorization:"Bearer "+((ses&&ses.token)||SUPA_KEY)}, extra||{}) }
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function limpio(s){s=(s||"").trim();return /^(-+|n\/?a|na|s\/d)$/i.test(s)?"":s}
function hoyISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function isoDe(n){const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dias(f){ return Math.round((new Date(hoyISO())-new Date(f))/86400000) }

/* Un fetch que se rinde. Sin esto, en senal debil el telefono no falla:
   se queda esperando y la pantalla se ve colgada para siempre. Quince segundos
   son de sobra para una respuesta buena y poco para una espera inutil. */
const LIMITE_RED = 15000;
/* Los archivos van aparte: una foto en senal debil tarda de verdad, y rendirse
   a los quince segundos seria tirarle la evidencia al tecnico. */
const LIMITE_ARCHIVO = 120000;
function conTiempoArchivo(url, o){ return conTiempo(url, o, LIMITE_ARCHIVO) }
function conTiempo(url, o, ms){
  return new Promise(function(ok, mal){
    const corta = new AbortController();
    const reloj = setTimeout(function(){
      corta.abort();
      const err = new Error("sin conexión");  /* el telefono no alcanzo el servidor */
      err.red = true;
      mal(err);
    }, ms || LIMITE_RED);
    fetch(url, Object.assign({}, o || {}, {signal: corta.signal}))
      .then(function(r){ clearTimeout(reloj); ok(r) })
      .catch(function(x){ clearTimeout(reloj); mal(x) });
  });
}

async function api(path,opts,reint){
  const o=Object.assign({},opts||{});
  o.headers=hdr(Object.assign({"Content-Type":"application/json"}, o.headers||{}));
  const r=await conTiempo(SUPA_URL+"/rest/v1/"+path,o);
  const t=await r.text();
  if((r.status===401||r.status===403)&&!reint&&ses){ if(await renovar()) return api(path,opts,true) }
  if(!r.ok) throw new Error("HTTP "+r.status+" "+t.slice(0,120));
  return t?JSON.parse(t):null;
}
async function auth(c,tipo){
  const r=await conTiempo(SUPA_URL+"/auth/v1/token?grant_type="+tipo,
    {method:"POST",headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(c)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg||j.error_description||("HTTP "+r.status));
  return j;
}
function guardarSes(j){
  ses={token:j.access_token,refresh:j.refresh_token,
       usuario:(j.user&&j.user.email||"").split("@")[0],
       rol:(j.user&&j.user.user_metadata&&j.user.user_metadata.rol)||"",
       coord:(j.user&&j.user.user_metadata&&j.user.user_metadata.coord)||""};
  localStorage.setItem("md_cierre",JSON.stringify(ses));
  /* ---------- una sola sesion para todo ----------
     Cada pantalla guardaba su sesion aparte, asi que al pasar de
     supervision a captura la segunda no encontraba nada y volvia a
     pedir la clave, mostrando ademas el primer nombre de la lista.
     Ahora la sesion se escribe tambien en una llave comun y todas la
     leen: se entra una vez y se anda por las etapas sin teclear otra vez. */
  ses.visto = Date.now();
  localStorage.setItem("md_cierre",JSON.stringify(ses));
  localStorage.setItem("md_web",JSON.stringify(ses));
}
async function renovar(){
  if(!ses||!ses.refresh) return false;
  try{ guardarSes(await auth({refresh_token:ses.refresh},"refresh_token")); return true }catch(e){ return false }
}
async function entrar(){
  const u=document.getElementById("inUsr").value, p=document.getElementById("inPwd").value;
  const e=document.getElementById("err");
  try{
    guardarSes(await auth({email:u+"@"+DOMINIO,password:p},"password"));
    localStorage.setItem("md_quien", u);
    document.getElementById("mLogin").style.display="none"; arrancar();
  }catch(x){ e.textContent="No se pudo entrar"; e.style.display="block" }
}
function salir(){
  /* Salir cierra en TODAS las pantallas, no solo en esta. Cada una guarda
     su propia copia de la sesion: si se borraba nada mas la de aqui, las
     otras seguian abiertas y al volver se entraba sin pedir la clave. */
  ["md_capt", "md_prog", "md_coord", "md_cierre", "md_cat", "md_lev", "md_sup", "md_ventas", "md_demanda", "md_ses", "md_web"]
    .forEach(function(k){ localStorage.removeItem(k) });
  location.reload();
}
function nombreDe(u){
  return ({"est.jenifer":"Jenifer","est.ivan":"Iván","est.patricia":"Patricia",
           "est.jair":"Jair","est.alin":"Alin","est.proyectos":"Karina",
           "est.gloria":"Montserrat","est.ariana":"Ariana","est.gerencia":"Gerencia",
           "est.subgerencia":"Subgerencia"})[u] || u;
}

/* Qué evidencia pide cada coordinación para dar por bueno un cierre. */
const PIDE={LEV:["LEVANTAMIENTO","CROQUIS","REPORTE"],
            CAT:["ATENCION","REPORTE"],
            _:["ANTES","DESPUES","REPORTE"]};
function pideDe(co){ return PIDE[co]||PIDE._ }
function cerrado(x){ return (x.status||"").toUpperCase().trim()==="ATENDIDO" }
function abierto(x){
  return ["ATENDIDO","CANCELADO"].indexOf((x.status||"").toUpperCase().trim())<0;
}

async function arrancar(){
  document.getElementById("who").innerHTML="<b>"+esc(nombreDe(ses.usuario))+"</b>salir";
  document.getElementById("barra").style.display="flex";
  ponerBarra();
  if(!document.getElementById("fDe").value){
    document.getElementById("fDe").value=isoDe(-30);
    document.getElementById("fA").value=hoyISO();
    const mia=SUYA[ses.usuario];
    if(mia) document.getElementById("fCoord").value=mia;
  }
  try{
    const c=await api("catalogos?select=catalogo,valor,orden&order=catalogo,orden&limit=1000");
    CAT={}; c.forEach(x=>(CAT[x.catalogo]=CAT[x.catalogo]||[]).push(x.valor));
  }catch(e){ CAT={} }
  if(!CAT.STATUS) CAT.STATUS=["PROGRAMADO","REPROGRAMADO","ATENDIDO","CANCELADO","CONTINUIDAD"];
  cargar();
}
function rango(n){
  document.getElementById("fDe").value=isoDe(-n);
  document.getElementById("fA").value=hoyISO();
  cargar();
}

/* Cuantos hay en total. Pedirlos y contarlos no sirve: el servidor entrega
   como maximo 1000 renglones y el numero saldria topado en 1000, que fue
   justo el error de la primera version de este aviso. Con `count=exact` el
   total viene en la cabecera Content-Range. */
async function cuantos(filtro){
  const r=await conTiempo(SUPA_URL+"/rest/v1/servicios?select=id"+filtro+"&limit=1",
    {headers:hdr({Prefer:"count=exact"})});
  const cr=r.headers.get("Content-Range")||"";
  const n=Number(String(cr).split("/")[1]);
  return isNaN(n) ? 0 : n;
}

/* ---------- cinta de cumplimiento: lo comprometido que ya vencio ----------
   La meta que la base si registra es la FECHA DE SERVICIO. Un servicio con la
   fecha pasada y sin cerrar es una meta no cumplida, y eso es lo que se mide.
   No se usa `dias_est` porque casi nadie lo llena: 79 servicios de 5,925, y
   ninguno rebasa su plazo. Un semaforo sobre ese campo saldria verde siempre.

   El color lo decide la ANTIGUEDAD, no la cantidad: diez servicios de ayer se
   recuperan; uno de hace tres meses ya se perdio.
       verde  nada vencido
       ambar  hay vencidos, ninguno pasa de 30 dias
       rojo   alguno pasa de 30 dias
*/
const CIERRE_FUERA='(ATENDIDO,CANCELADO,PROSPECTO,"ATENCION VENTAS")';
async function _cuantosAtraso(filtro){
  try{
    const r=await conTiempo(SUPA_URL+"/rest/v1/servicios?select=id"+filtro+"&limit=1",
      {headers:hdr({Prefer:"count=exact"})});
    const n=Number(String(r.headers.get("Content-Range")||"").split("/")[1]);
    return isNaN(n)?0:n;
  }catch(e){ return 0 }
}
function _hoyIso(){const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function _haceDias(n){const d=new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

async function pintarCinta(){
  const c=document.getElementById("cinta");
  if(!c) return;
  const sel=document.getElementById("fCoord");
  const co=sel?sel.value:"";
  const dond=(co?"&coord=eq."+encodeURIComponent(co):"");
  const base="&status=not.in."+CIERRE_FUERA+dond;
  const vencidos=await _cuantosAtraso(base+"&fecha_servicio=lt."+_hoyIso());
  if(!vencidos){
    c.className="cinta verde";
    c.innerHTML='<span class="foco">●</span><b>Al día</b>'+
      '<span class="det">No hay servicios'+(co?" de "+esc(co):"")+
      ' con la fecha vencida y sin cerrar.</span>';
    return;
  }
  const graves=await _cuantosAtraso(base+"&fecha_servicio=lt."+_haceDias(30));
  const viejo =await api("servicios?select=fecha_servicio,nombre&status=not.in."+CIERRE_FUERA+
    dond+"&fecha_servicio=lt."+_hoyIso()+"&order=fecha_servicio.asc&limit=1");
  let dd=0, nom="";
  if(viejo && viejo.length){
    dd=Math.round((new Date(_hoyIso())-new Date(viejo[0].fecha_servicio))/86400000);
    nom=viejo[0].nombre||"";
  }
  c.className="cinta "+(graves?"rojo":"ambar");
  c.innerHTML='<span class="foco">●</span>'+
    '<b>'+vencidos+' servicio'+(vencidos>1?"s":"")+' con la fecha vencida</b>'+
    '<span class="det">'+(graves?graves+" con más de un mes. ":"")+
    (dd?"El más viejo lleva "+dd+" días: "+esc(nom.slice(0,34))+".":"")+'</span>'+
    '<a href="cierre.html">Ver y cerrar →</a>';
}

async function cargar(){
  const de=document.getElementById("fDe").value, a=document.getElementById("fA").value;
  const co=document.getElementById("fCoord").value;
  if(!de||!a) return;
  document.getElementById("lista").innerHTML='<div class="load">Cargando…</div>';
  try{
    filas=await api("servicios?select=id,coord,tkt,nombre,dependencia,fecha_servicio,"+
      "fecha_atencion,status,tecnico,auxiliar,obs_coord,obs_prog,tipo_servicio,obra,dias_est,dia_n,"+
      "avance_tec,avance_coord,avance_ts,avance_nota"+
      "&fecha_servicio=gte."+de+"&fecha_servicio=lte."+a+(co?"&coord=eq."+co:"")+
      "&order=fecha_servicio&limit=800");
    await cargarEvidencias();
    await cargarSolicitudes();
    /* Aparte del rango elegido: lo que quedo sin cerrar hace mas de un mes.
       El rango por omision son 30 dias y "Ver todos" abre doce meses, asi que
       una obra parada desde hace ano y medio no salia por ningun lado aqui.
       Estas no dependen del rango: siempre se avisan. */
    /* FUERA los mismos estatus que no cuentan en el reporte: atendido y
       cancelado ya terminaron, y prospecto y atencion ventas todavia no son
       trabajo del area. Si no, la lista se llena de cosas que no hay que cerrar. */
    const FUERA="(ATENDIDO,CANCELADO,PROSPECTO,\"ATENCION VENTAS\")";
    const filtroAtoro="&status=not.in."+FUERA+
      "&fecha_servicio=lt."+isoDe(-30)+(co?"&coord=eq."+co:"");
    try{
      atorados = await api("servicios?select=coord,id,tkt,nombre,dependencia,"+
        "fecha_servicio,status,tecnico"+filtroAtoro+"&order=fecha_servicio.asc&limit=25");
      totalAtorados = await cuantos(filtroAtoro);
    }catch(e){ atorados=[]; totalAtorados=0 }
    pintar();
  }catch(e){
    document.getElementById("lista").innerHTML=
      '<div class="vacio">No se pudo consultar.<br><span class="sub">'+esc(String(e).slice(0,120))+'</span></div>';
  }
}
/* La evidencia se pide en bloque por coordinación, no una consulta por servicio:
   con 800 renglones eso serían 800 viajes. */
async function cargarEvidencias(){
  EV={};
  const coords=[...new Set(filas.map(x=>x.coord))];
  for(const co of coords){
    const ids=filas.filter(x=>x.coord===co).map(x=>x.id);
    for(let i=0;i<ids.length;i+=200){
      const t=ids.slice(i,i+200).join(",");
      try{
        const e=await api("evidencias?select=servicio_id,tipo&coord=eq."+co+"&servicio_id=in.("+t+")");
        e.forEach(r=>{
          const k=co+"|"+r.servicio_id;
          (EV[k]=EV[k]||new Set()).add(String(r.tipo||"").split("|")[0].toUpperCase());
        });
      }catch(x){}
    }
  }
}
function evidencia(x){
  const tiene=EV[x.coord+"|"+x.id]||new Set();
  return pideDe(x.coord).map(t=>({t:t, ok:tiene.has(t)}));
}
function completo(x){ return evidencia(x).every(e=>e.ok) }

function vistas(){
  const v=document.getElementById("fVer").value;
  if(v==="abierto") return filas.filter(abierto);
  if(v==="sinev")   return filas.filter(x=>cerrado(x)&&!completo(x));
  return filas;
}

/* ---------- buscador de TKT y casilla de ver todos ----------
   Los dos venian de la estacion de Excel: txtBuscarTkt filtraba la cola por TKT
   o por nombre, y chkTodos decidia si se veia nada mas lo pendiente de esa etapa
   o todo el historico de la coordinacion.

   El buscador filtra sobre lo ya pintado (no vuelve a la base): es instantaneo
   y no toca los indices de los renglones, que son los que usan los desplegables
   para saber a que servicio le estan guardando. */
function filtrarVista(){
  const e=document.getElementById("fTkt");
  const q=(e?e.value:"").trim().toUpperCase();
  const t=document.getElementById("fTec");
  const tec=(t?t.value:"");
  const trs=document.querySelectorAll("#lista tbody tr");
  let vistos=0;
  trs.forEach(function(tr){
    const x=filas[Number(tr.dataset.i)];
    const okT = !tec || (x && (limpio(x.tecnico)||"—")===tec);
    const ok = okT && (!q || tr.textContent.toUpperCase().indexOf(q)>=0);
    tr.style.display = ok ? "" : "none";
    if(ok) vistos++;
  });
  pintarLote();
  const c=document.getElementById("cuentaTkt");
  if(c) c.textContent = q ? (vistos+" de "+trs.length+" con «"+e.value.trim()+"»") : "";
}
/* Ver todos: deja de mostrar nada mas lo pendiente y abre el rango de fechas. */
function verTodos(){
  const on=document.getElementById("fTodos").checked;
  const ver=document.getElementById("fVer");
  if(ver){ ver.value = on ? "" : ver.options[0].value; }
  const de=document.getElementById("fDe"), a=document.getElementById("fA");

    de.value=de.dataset.previo; a.value=a.dataset.previo;
  }
  if(typeof cargar==="function") cargar();
  else if(typeof cargarAt==="function") cargarAt();
  else if(typeof pintar==="function") pintar();
}

/* ---------- avance de obra contra lo planeado ----------
   Lo planeado sale del calendario: dia 4 de 10 son 40%. Se compara con lo que
   vale de verdad —lo que confirmo coordinacion si ya lo reviso, y si no lo que
   declaro el instalador— y se marca atrasado cuando queda mas de diez puntos
   abajo. Diez puntos es el ruido normal de estimar a ojo; avisar por menos
   convierte el semaforo en adorno. */
function esperadoDe(x){
  if(!x.obra || !x.dias_est) return null;
  return Math.min(100, Math.round(100*(x.dia_n||1)/x.dias_est));
}
function avanceReal(x){
  return (x.avance_coord!=null) ? x.avance_coord
       : (x.avance_tec!=null)   ? x.avance_tec : null;
}
function celdaAvance(x, i){
  const esp=esperadoDe(x);
  if(esp===null) return '<span class="sub">—</span>';
  const real=avanceReal(x);
  const atras = (real!=null) && (real-esp < -10);
  return '<div class="av">'+
    '<input type="number" min="0" max="100" step="5" value="'+(real!=null?real:"")+'"'+
      ' title="Confirma o corrige el avance"'+
      ' onchange="ponAvanceCoord('+i+',this.value)">'+
    '<span class="'+(atras?"atras":(real!=null?"bien":""))+'">%</span>'+
    '<span class="pl">plan '+esp+'% · día '+(x.dia_n||1)+' de '+x.dias_est+
      (x.avance_tec!=null?' · instalador '+x.avance_tec+'%':'')+'</span>'+
    '<span id="av'+i+'"></span></div>';
}
async function ponAvanceCoord(i, valor){
  const x=filas[i], av=document.getElementById("av"+i);
  const v=Math.max(0, Math.min(100, Number(valor)||0));
  if(av) av.innerHTML='<span class="sub">…</span>';
  try{
    const d=await api("servicios?coord=eq."+encodeURIComponent(x.coord)+"&id=eq."+x.id,
      {method:"PATCH", headers:{Prefer:"return=representation"},
       body:JSON.stringify({avance_coord:v,
         avance_ts:new Date().toISOString().slice(0,16).replace("T"," ")})});
    if(!d||!d.length) throw new Error("no se guardó");
    x.avance_coord=v;
    anotar("AVANCE", "ID="+x.id+" · coordinación confirma "+v+"%", x);
    if(av) av.innerHTML='<span class="guardado">✓</span>';
    pintar();
  }catch(e){ if(av) av.innerHTML='<span class="fallo">no se guardó</span>' }
}

/* ---------- buscar en toda la base, no solo en lo pintado ----------
   El recuadro filtraba los renglones que ya estaban en pantalla. Si el servicio
   era de otro dia o quedaba fuera del rango, no aparecia y parecia que el
   buscador no servia. Ahora se le pregunta a la base.

   Se busca por PALABRAS: cada una tiene que aparecer en el TKT, el nombre o la
   dependencia, sin importar el orden ni las mayusculas. Los patrones van entre
   comillas para que una coma no tumbe la consulta. */
function filtroPalabras(q, campos){
  const pal=String(q||"").trim().split(/[\s,;\-\/.]+/)
    .map(function(w){ return w.replace(/["\\(),]/g,"") })
    .filter(function(w){ return w.length>=2 });
  if(!pal.length) return "";
  const bloques=pal.map(function(w){
    return "or("+campos.map(function(c){ return c+'.ilike."*'+w+'*"' }).join(",")+")";
  });
  return "&and=("+bloques.join(",")+")";
}

      '<div class="tabla"><table><thead><tr><th>Fecha</th><th>Servicio</th>'+

          '<td><div class="sitio">'+esc((x.nombre||"").slice(0,44))+'</div>'+
          '<div class="sub"><span class="tag">'+esc(x.coord)+'</span>'+
          (x.tkt?" TKT "+esc(x.tkt):"")+
          (limpio(x.dependencia)?" · "+esc(x.dependencia):"")+'</div></td>'+
          '<td class="sub">'+esc(limpio(x.tecnico)||"—")+'</td>'+

            : '<span class="sub">sin fecha: está en programación</span>')+'</td></tr>';
      }).join("")+'</tbody></table></div></div>';
  }catch(err){
    cont.innerHTML='<div class="hallados"><h3>No se pudo buscar</h3>'+

/* ---------- cerrar el dia en lote ----------
   Calcado de frmCierre del Excel, que es lo que hace que quien cierra mucho no
   quiera moverse de ahi: la lista del dia, un filtro por brigada, marcar varios
   y aplicarles a todos el mismo estatus y la misma nota de una vez.

   Lo seleccionado se guarda por clave (coordinacion + id) y no por posicion,
   porque la tabla se vuelve a pintar sola despues de cada guardado y los indices
   cambian de lugar. */
let SEL = new Set();
function claveDe(x){ return x.coord+"|"+x.id }

function marcarUno(i, on){
  const k=claveDe(filas[i]);
  if(on) SEL.add(k); else SEL.delete(k);
  pintarLote();
}
/* marca solo lo que se esta viendo: el "Todos" del VBA tambien respetaba el
   filtro de tecnico, y marcar de golpe cosas escondidas es como se cierra por
   error un servicio que ni sabias que estaba ahi */
function selTodos(on){
  document.querySelectorAll("#lista tbody tr").forEach(function(tr){
    if(tr.style.display==="none") return;
    const x=filas[Number(tr.dataset.i)];
    if(!x) return;
    if(on) SEL.add(claveDe(x)); else SEL.delete(claveDe(x));
    const c=tr.querySelector(".selcol input");
    if(c) c.checked=on;
  });
  const st=document.getElementById("selTodo");
  if(st) st.checked=on;
  pintarLote();
}
function seleccionados(){
  return filas.filter(x=>SEL.has(claveDe(x)));
}
function pintarLote(){
  const caja=document.getElementById("lote");
  if(!caja) return;
  const n=seleccionados().length;
  document.getElementById("loteN").textContent=n;
  caja.classList.toggle("on", n>0);
  const est=document.getElementById("loteEst");
  if(est && !est.options.length)
    est.innerHTML=(CAT.STATUS||["ATENDIDO"]).map(x=>
      `<option${x==="ATENDIDO"?" selected":""}>${esc(x)}</option>`).join("");
}
/* la lista de brigadas sale de lo que hay cargado, no de un catalogo: interesa
   quien trabajo en el rango, no la plantilla completa */
function llenarTecnicos(){
  const sel=document.getElementById("fTec");
  if(!sel) return;
  const previo=sel.value;
  const hay=[...new Set(filas.map(x=>limpio(x.tecnico)||"—"))].sort();
  sel.innerHTML='<option value="">Todas</option>'+
    hay.map(t=>`<option${t===previo?" selected":""}>${esc(t)}</option>`).join("");
}

async function aplicarLote(){
  const v=seleccionados();
  if(!v.length) return;
  const est=document.getElementById("loteEst").value;
  const nota=document.getElementById("loteNota").value.trim();
  const aviso=document.getElementById("loteAviso");
  const conNota=nota?"\n\nY se les pondrá esta nota a todos:\n"+nota:"";
  if(!confirm("¿Marcar "+v.length+" servicio"+(v.length>1?"s":"")+" como "+est+"?"+conNota))
    return;

  /* Se agrupa para no hacer una peticion por servicio: misma coordinacion y
     misma fecha que sellar van juntos. Cincuenta servicios acaban siendo dos o
     tres peticiones. La fecha de atencion solo se pone si el servicio no la
     tenia: pisarla borraria cuando se atendio de verdad. */
  const grupos=new Map();
  v.forEach(function(x){
    const sella = (est==="ATENDIDO" && !limpio(x.fecha_atencion))
                ? (x.fecha_servicio||hoyISO()) : "";
    const k=x.coord+"|"+sella;
    if(!grupos.has(k)) grupos.set(k,{coord:x.coord, sella:sella, xs:[]});
    grupos.get(k).xs.push(x);
  });

  aviso.textContent="guardando…";
  let ok=0, fallo=0;
  for(const g of grupos.values()){
    const cuerpo={status:est};
    if(est==="ATENDIDO"||est==="CANCELADO") cuerpo.etapa_actual=4;
    if(g.sella) cuerpo.fecha_atencion=g.sella;
    if(nota)    cuerpo.obs_coord=nota;
    const ids=g.xs.map(x=>x.id).join(",");
    try{
      const d=await api("servicios?coord=eq."+encodeURIComponent(g.coord)+
                        "&id=in.("+ids+")",
        {method:"PATCH", headers:{Prefer:"return=representation"},
         body:JSON.stringify(cuerpo)});
      if(!d) throw new Error("sin respuesta");
      /* PostgREST devuelve los renglones que de verdad cambio: si una politica
         bloquea alguno, vuelve con menos y hay que decirlo, no dar por hecho */
      const tocados=new Set(d.map(r=>String(r.id)));
      g.xs.forEach(function(x){
        if(tocados.has(String(x.id))){ Object.assign(x, cuerpo); ok++; }
        else fallo++;
      });
    }catch(e){ fallo+=g.xs.length }
  }

  /* la bitacora en una sola insercion, con la misma leyenda que el Excel
     ("CIERRE DIA: ATENDIDO") para que el historial siga siendo comparable */
  try{
    const t=new Date(), p=n=>String(n).padStart(2,"0");
    const cuando=t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+" "+
                 p(t.getHours())+":"+p(t.getMinutes())+":"+p(t.getSeconds());
    const accion="CIERRE DIA: "+est+(nota?" + comentario":"");
    api("log",{method:"POST", headers:{Prefer:"return=minimal"},
      body:JSON.stringify(v.map(x=>({
        timestamp:cuando, usuario:nombreDe(ses&&ses.usuario), win_user:"web",
        coord:x.coord, rol:(ses&&ses.rol)||"", etapa:String(ETAPA_AQUI),
        tkt:x.tkt||"", accion:accion, detalle:"ID="+x.id
      })))}).catch(function(){});
  }catch(e){}

  SEL.clear();
  document.getElementById("loteNota").value="";
  aviso.textContent = fallo ? ("se guardaron "+ok+", fallaron "+fallo)
                            : ("listo, "+ok+" guardados");
  setTimeout(()=>{ aviso.textContent="" }, 6000);
  pintar();
}

/* ---------- informe final ----------
   El servicio se cierra aquí, pero el TKT no se cierra en el CRM hasta que hay
   informe final, y ese lo hace Jesús. Pedirlo por WhatsApp se pierde: no se
   sabe qué está pedido, desde cuándo, ni qué se entregó. */
let SOL={};
async function cargarSolicitudes(){
  SOL={};
  try{
    const s=await api("solicitudes_informe?select=*&limit=1000");
    s.forEach(r=>{ SOL[r.coord+"|"+r.servicio_id]=r });
  }catch(e){ SOL=null }        // la tabla todavía no existe: no se estorba
}
function informe(x,i){
  if(SOL===null) return '<span class="sub">—</span>';
  const s=SOL[x.coord+"|"+x.id];
  if(!s){
    if(!cerrado(x)) return '<span class="sub">al cerrarlo</span>';
    return `<button class="mini" onclick="pedirInforme(${i})">Pedir informe</button>`;
  }
  const cuando=(s.ts_solicitud||"").slice(0,10);
  if(s.estado==="ENTREGADO")
    return `<span class="guardado">✓ entregado</span>
      <div class="sub">${esc((s.ts_entrega||"").slice(0,10))}${s.atiende?" · "+esc(s.atiende):""}</div>
      ${s.ruta?`<a class="sub" href="#" onclick="abrirInforme('${esc(s.ruta)}');return false"
         style="color:var(--acc)">ver el informe</a>`:""}`;
  return `<span class="ev"><span class="no">● ${esc(s.estado.toLowerCase())}</span></span>
    <div class="sub">pedido ${esc(cuando)}${s.urgente?" · urgente":""}</div>`;
}
async function pedirInforme(i){
  const x=filas[i];
  const nota=prompt("¿Para qué lo necesitas o qué debe decir?\n(opcional, ayuda a Jesús)","");
  if(nota===null) return;
  const urgente=confirm("¿Es urgente?\n\nAceptar = urgente, va primero en la lista de Jesús.\nCancelar = normal.");
  try{
    await api("solicitudes_informe?on_conflict=coord,servicio_id",
      {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=representation"},
       body:JSON.stringify([{coord:x.coord, servicio_id:x.id, tkt:x.tkt||"",
         solicita:nombreDe(ses.usuario), urgente:urgente, nota:nota||null,
         estado:"SOLICITADO"}])});
    await cargarSolicitudes();
    pintar();
  }catch(e){ alert("No se pudo pedir: "+String(e).slice(0,140)) }
}
async function abrirInforme(ruta){
  try{
    const r=await conTiempoArchivo(`${SUPA_URL}/storage/v1/object/${BUCKET}/${ruta}`,{headers:hdr()});
    if(!r.ok) throw new Error("HTTP "+r.status);
    window.open(URL.createObjectURL(await r.blob()),"_blank");
  }catch(e){ alert("No se pudo abrir: "+String(e).slice(0,120)) }
}

const ETAPA_AQUI=4;

/* ---------- bitacora: quien movio que ----------
   Es el mismo LOG que llevaba la estacion de Excel (LogSupa). Al pasar a web se
   habia quedado sin anotar, y con la gente migrando el rastro se perdia.

   Se manda sin esperar y con el error tragado a proposito: si la bitacora
   falla, el trabajo del usuario ya quedo guardado y no tiene por que enterarse.
   Un log que estorba se acaba quitando. */
function anotar(accion, detalle, x){
  try{
    const t=new Date();
    const p=n=>String(n).padStart(2,"0");
    api("log",{method:"POST", headers:{Prefer:"return=minimal"}, body:JSON.stringify({
      timestamp:t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+" "+
                p(t.getHours())+":"+p(t.getMinutes())+":"+p(t.getSeconds()),
      usuario:nombreDe(ses&&ses.usuario), win_user:"web",
      coord:(x&&x.coord)||(ses&&ses.coord)||"", rol:(ses&&ses.rol)||"",
      etapa:String((x&&x.etapa_actual)||ETAPA_AQUI),
      tkt:(x&&x.tkt)||"", accion:accion, detalle:detalle||""
    })}).catch(function(){});
  }catch(e){}
}

async function editar(i, campo, valor){
  const x=filas[i], celda=document.getElementById("est"+i);
  const antes=x[campo], cuerpo={};
  cuerpo[campo]=valor;
  /* Dar por atendido sin decir cuándo deja el servicio sin fecha real, y de ahí
     salen los conteos que no cuadran. Se sella con la fecha del servicio. */
  if(campo==="status" && valor==="ATENDIDO" && !limpio(x.fecha_atencion))
    cuerpo.fecha_atencion=x.fecha_servicio||hoyISO();
  /* Cerrar aqui sin mover la etapa dejaba el servicio como pendiente para
     siempre en las colas del Excel, que se arman por etapa y no por fecha. */
  if(campo==="status" && (valor==="ATENDIDO"||valor==="CANCELADO"))
    cuerpo.etapa_actual=4;
  x[campo]=valor;
  if(celda) celda.innerHTML='<span class="sub">guardando…</span>';
  try{
    const d=await api(`servicios?coord=eq.${encodeURIComponent(x.coord)}&id=eq.${x.id}`,
      {method:"PATCH", headers:{Prefer:"return=representation"}, body:JSON.stringify(cuerpo)});
    if(!d||!d.length) throw new Error("no encontró el servicio");
    Object.assign(x, cuerpo);
    anotar(campo==="status" ? "AVANZA A "+valor : "GUARDAR",
           "ID="+x.id+" · "+campo+" = "+(valor||"(vacío)"), x);
    if(celda){ celda.innerHTML='<span class="guardado">✓</span>';
      setTimeout(()=>{ if(celda) celda.innerHTML="" },2500) }
    const ab=filas.filter(abierto).length, se=filas.filter(y=>cerrado(y)&&!completo(y)).length;
    document.getElementById("resumen").innerHTML=`
      <div class="pill"><b>${filas.length}</b>en el rango</div>
      <div class="pill"><b style="color:${ab?"#F0BE6E":"#5BD79B"}">${ab}</b>sin cerrar</div>
      <div class="pill"><b style="color:${se?"#F0BE6E":"#5BD79B"}">${se}</b>cerrados sin evidencia</div>`;
  }catch(e){
    x[campo]=antes;
    if(celda) celda.innerHTML='<span class="fallo">no se guardó</span>';
  }
}

/* ---------- barra de etapas, como en la estacion de Excel ----------
   Alla habia una sola ventana: se elegia la coordinacion y con dos botones se
   iba y venia entre Captura, Programa, Coordina y Supervisa. Aqui cada etapa es
   una pantalla, asi que los botones navegan; la coordinacion elegida viaja con
   uno para no tener que volver a filtrarla en cada etapa. */
const FLUJO=[["captura.html","Captura"],
             ["programacion.html","Programa"],
             ["coordinacion.html","Coordina"],
             ["cierre.html","Supervisa"]];
const COORDS_BARRA=[["LEV","Levantamientos"],["INST","Instalaciones"],
                    ["MANT","Mantenimientos"],["CAT","CAT"],
                    ["PRY_ESP","Proyectos especiales"]];

function coordElegida(){
  const u=new URLSearchParams(location.search).get("coord");
  if(u) localStorage.setItem("md_coord_sel", u);
  return localStorage.getItem("md_coord_sel")||"";
}
function irEtapa(paso){
  const i=ETAPA_AQUI-1+paso;
  if(i<0||i>=FLUJO.length) return;
  const c=document.getElementById("brCoord");
  const q=c&&c.value ? "?coord="+encodeURIComponent(c.value) : "";
  location.href=FLUJO[i][0]+q;
}
function cambiaCoordBarra(){
  const c=document.getElementById("brCoord").value;
  localStorage.setItem("md_coord_sel", c);
  const f=document.getElementById("fCoord");
  if(f){ f.value=c; if(typeof cargar==="function") cargar(); }
}
function ponerBarra(){
  const b=document.getElementById("etapas");
  if(!b) return;
  const sel=coordElegida();
  b.innerHTML=
    '<div class="etapas">'+
      '<button class="paso" onclick="irEtapa(-1)"'+(ETAPA_AQUI<=1?" disabled":"")+
        '>&#9664; Etapa anterior</button>'+
      FLUJO.map(function(f,i){
        const aqui=(i===ETAPA_AQUI-1);
        const q=sel?"?coord="+encodeURIComponent(sel):"";
        return (i?'<span class="fl">&rsaquo;</span>':"")+
          '<a href="'+f[0]+q+'"'+(aqui?' class="aqui"':"")+'>'+(i+1)+'. '+f[1]+'</a>';
      }).join("")+
      '<button class="paso" onclick="irEtapa(1)"'+(ETAPA_AQUI>=FLUJO.length?" disabled":"")+
        '>Etapa siguiente &#9654;</button>'+
      '<span class="fl">|</span>'+
      '<select id="brCoord" onchange="cambiaCoordBarra()" title="Coordinación">'+
        '<option value="">Todas las coordinaciones</option>'+
        COORDS_BARRA.map(function(c){
          return '<option value="'+c[0]+'"'+(c[0]===sel?" selected":"")+'>'+c[1]+'</option>'
        }).join("")+
      '</select>'+
      '<a href="inicio.html" class="ini">&#9776; Inicio</a>'+
    '</div>';
  /* la coordinacion elegida manda sobre el filtro de la pantalla */
  const f=document.getElementById("fCoord");
  if(f && sel){ f.value=sel; }
}


(async function(){
  /* La sesion guardada se usa DE INMEDIATO, sin esperar a la red: antes se
     hacian hasta dos llamadas -renovar el token y, si fallaba, probar un
     pase viejo- antes de pintar nada, y con senal debil eso son hasta treinta
     segundos de pantalla en blanco. Ahora se pinta ya, con lo que hay, y la
     validez se revisa por detras.

     Y si de verdad la sesion vencio -no la red, la sesion- el recuadro de la
     clave TIENE que volver a mostrarse: quedarse escondido, como pasaba antes,
     deja a quien lo abre sin manera de volver a entrar. */
  if(!ses) return;
  document.getElementById("mLogin").style.display="none";
  arrancar();
  let sirve = await renovar();
  if(!sirve){
    /* el refresco pudo fallar por la red, no por la sesion: se prueba el
       pase que ya se tenia antes de correr a nadie */
    try{ await api("servicios?select=id&limit=1"); sirve = true; }
    catch(e){ sirve = false; }
  }
  if(sirve) return;
  localStorage.removeItem("md_cierre");
  localStorage.removeItem("md_web");
  ses = null;
  document.getElementById("mLogin").style.display="flex";
  const e=document.getElementById("err");
  if(e){ e.textContent="Tu sesion vencio. Vuelve a entrar con tu clave.";
         e.style.display="block"; }
})();

/* ---------- que no salga siempre el primero de la lista ----------
   El menu se quedaba en la primera opcion, y esa es Jenifer: todos veian su
   nombre al entrar. Ahora se preselecciona quien uso esta pantalla la ultima vez
   en este equipo, o a quien se eligio en el inicio. Es solo comodidad: la clave
   se sigue pidiendo igual. */
function recordarQuien(){
  const sel=document.getElementById("inUsr");
  if(!sel) return;
  const u=localStorage.getItem("md_quien");
  if(u && sel.querySelector('option[value="'+u+'"]')) sel.value=u;
}
try{ recordarQuien(); }catch(e){}
