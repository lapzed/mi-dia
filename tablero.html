<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B2038">
<title>MD Control · Tablero de dirección</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#0B2038; --bg2:#0E2A47; --card:#12314F; --line:#1D4267;
    --txt:#EAF2FB; --txt2:#9DB6D2; --txt3:#6E8CAD;
    --acc:#63B3FF; --ok:#1E8E5A; --warn:#E8A33D; --bad:#C6413B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);line-height:1.45;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px 60px}
  header{position:sticky;top:0;z-index:400;background:linear-gradient(180deg,#0B2038,#0E2A47);
    border-bottom:1px solid var(--line);padding:13px 18px;margin:0 -18px 18px}
  .brand{display:flex;align-items:center;gap:12px;max-width:1280px;margin:0 auto}
  .bt{font-size:18px;font-weight:800}
  .bs{font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.05em}
  .who{margin-left:auto;text-align:right;font-size:11px;color:var(--txt2);cursor:pointer}
  .who b{display:block;color:var(--txt);font-size:12px}

  button{font:inherit;border:none;border-radius:10px;padding:9px 14px;font-size:13px;
    font-weight:700;cursor:pointer;background:#17456E;color:var(--acc)}
  button.pri{background:var(--acc);color:#07203a}
  select,input{padding:9px 10px;border-radius:10px;background:#0F2C4A;color:var(--txt);
    border:1px solid var(--line);font:inherit;font-size:13px}

  .barra{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .periodo{font-size:15px;font-weight:700}
  .sub{font-size:12px;color:var(--txt3)}

  /* pensado para proyectarse: numeros grandes y pocas palabras */
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;margin-bottom:18px}
  .t{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px}
  .t .n{font-size:34px;font-weight:800;line-height:1.05}
  .t .q{font-size:12.5px;color:var(--txt2);margin-top:3px}
  .t.ok .n{color:#7BE0AE} .t.ojo .n{color:#F0BE6E} .t.mal .n{color:#F3B0AC}

  h2{font-size:15px;margin:24px 0 10px;color:var(--acc);text-transform:uppercase;
    letter-spacing:.06em}
  .caja{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--txt2);padding:8px 9px;border-bottom:1px solid var(--line)}
  td{padding:7px 9px;border-bottom:1px solid rgba(29,66,103,.5)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .barrita{height:8px;border-radius:5px;background:#0F2C4A;overflow:hidden;margin-top:5px}
  .barrita i{display:block;height:100%;border-radius:5px;background:var(--acc)}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:#17456E;color:var(--acc);white-space:nowrap}
  .rojo{color:#F3B0AC} .ambar{color:#F0BE6E} .verde{color:#7BE0AE}

  #mapa{height:380px;border-radius:15px;border:1px solid var(--line);overflow:hidden;z-index:1}
  .leaflet-popup-content-wrapper{background:#12314F;color:#EAF2FB;border-radius:11px}
  .leaflet-popup-tip{background:#12314F}

  .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
  .load{text-align:center;color:var(--txt2);padding:44px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(5,16,28,.95);z-index:900;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;
    max-width:390px;width:100%}
  .box h2{margin:0 0 3px;font-size:17px;color:var(--txt);text-transform:none;letter-spacing:0}
  .box p{margin:0 0 14px;font-size:12.5px;color:var(--txt2)}
  .box select,.box input{width:100%;margin-bottom:11px}
  .aviso{background:rgba(198,65,59,.14);border:1px solid rgba(198,65,59,.4);color:#F0A9A5;
    border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:11px}
  .bien{background:rgba(30,142,90,.16);border:1px solid rgba(30,142,90,.45);color:#9EE7C2;
    border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="27" height="27" viewBox="0 0 100 100"><path d="M50 8 L92 88 L8 88 Z" fill="none" stroke="#63B3FF" stroke-width="11" stroke-linejoin="round"/></svg>
      <div><div class="bt">MD Control</div><div class="bs">TABLERO DE DIRECCIÓN</div></div>
      <div class="who" id="who" onclick="salir()"></div>
    </div>
  </header>

  <div class="barra" id="barra" style="display:none">
    <button onclick="mover(-7)">◀ Semana anterior</button>
    <span class="periodo" id="lblSemana"></span>
    <button onclick="mover(7)">Semana siguiente ▶</button>
    <button onclick="mover(0)">Esta semana</button>
    <button onclick="cargar()">Actualizar</button>
    <button class="pri" onclick="compartir()" style="margin-left:auto">🔗 Compartir</button>
    <a href="inicio.html" style="align-self:center;color:var(--txt2);font-size:12.5px;
       text-decoration:none">☰ Inicio</a>
  </div>

  <div id="compartirCaja"></div>
  <div id="cuerpo"><div class="load">Entra para ver el tablero.</div></div>
</div>

<div class="modal" id="mLogin">
  <div class="box">
    <h2>Tablero de dirección</h2>
    <p>Los números del área, al momento.</p>
    <select id="inUsr">
      <option value="est.gerencia">Gerencia</option>
      <option value="est.subgerencia">Subgerencia</option>
      <option value="est.gloria">Montserrat · Aux administrativo</option>
    </select>
    <input id="inPwd" type="password" placeholder="clave"
           onkeydown="if(event.key==='Enter')entrar()">
    <div class="aviso" id="err" style="display:none"></div>
    <button class="pri" style="width:100%" onclick="entrar()">Entrar</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPA_URL="https://buwoxejgnmyvshwznbaj.supabase.co";
const SUPA_KEY="sb_publishable_Pts8K36Tj4vZ7UzSAwwicw_K6I11-Aw";
const DOMINIO="mdcontrol.local";

const LLAVES_SESION=["md_capt","md_prog","md_coord","md_cierre","md_cat","md_lev",
  "md_sup","md_ventas","md_demanda","md_ses","md_web","md_tec","md_tablero"];

/* ---------- la sesion guardada caduca ---------- */
const DIAS_SESION = 15;
function sesionVigente(s){
  if(!s) return null;
  if(s.visto && (Date.now() - s.visto) > DIAS_SESION*86400000) return null;
  return s;
}

let ses=sesionVigente(JSON.parse(localStorage.getItem("md_tablero")||
  localStorage.getItem("md_web")||"null"));
let lunes=null, mapa=null, capa=null, D={};

function hdr(extra){ return Object.assign({apikey:SUPA_KEY,
  Authorization:"Bearer "+((ses&&ses.token)||SUPA_KEY)}, extra||{}) }
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function limpio(s){s=(s||"").trim();return /^(-+|n\/?a|na|s\/d|por asignar)$/i.test(s)?"":s}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0")}
function isoDe(n){const d=new Date(); d.setDate(d.getDate()+n); return iso(d)}
function lunesDe(d){const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x}
function masDias(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function ddmmm(d){return String(d.getDate()).padStart(2,"0")+"-"+MES[d.getMonth()]}

async function api(path,opts,reint){
  const o=Object.assign({},opts||{});
  o.headers=hdr(Object.assign({"Content-Type":"application/json"}, o.headers||{}));
  const r=await fetch(SUPA_URL+"/rest/v1/"+path,o);
  const t=await r.text();
  if((r.status===401||r.status===403)&&!reint&&ses){ if(await renovar()) return api(path,opts,true) }
  if(!r.ok) throw new Error("HTTP "+r.status+" "+t.slice(0,140));
  return t?JSON.parse(t):null;
}
/* El total exacto viene en la cabecera, no de contar lo devuelto: el servidor
   entrega maximo mil renglones y el numero saldria topado. */
async function cuantos(filtro){
  const r=await fetch(SUPA_URL+"/rest/v1/servicios?select=id"+filtro+"&limit=1",
    {headers:hdr({Prefer:"count=exact"})});
  const n=Number(String(r.headers.get("Content-Range")||"").split("/")[1]);
  return isNaN(n)?0:n;
}
async function auth(cuerpo,tipo){
  const r=await fetch(SUPA_URL+"/auth/v1/token?grant_type="+tipo,
    {method:"POST",headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},
     body:JSON.stringify(cuerpo)});
  if(!r.ok) throw new Error("no entró");
  return r.json();
}
function guardar(j){
  ses={token:j.access_token, refresh:j.refresh_token,
       usuario:(j.user&&j.user.email||"").split("@")[0],
       rol:(j.user&&j.user.user_metadata&&j.user.user_metadata.rol)||"",
       coord:(j.user&&j.user.user_metadata&&j.user.user_metadata.coord)||"",
       visto:Date.now()};
  localStorage.setItem("md_tablero",JSON.stringify(ses));
  localStorage.setItem("md_web",JSON.stringify(ses));
}
async function renovar(){
  if(!ses||!ses.refresh) return false;
  try{ guardar(await auth({refresh_token:ses.refresh},"refresh_token")); return true }catch(e){ return false }
}
function salir(){
  LLAVES_SESION.forEach(function(k){ localStorage.removeItem(k) });
  location.reload();
}
function nombreDe(u){
  return ({"est.gerencia":"Gerencia","est.subgerencia":"Subgerencia",
           "est.gloria":"Montserrat"})[u] || u;
}
async function entrar(){
  const u=document.getElementById("inUsr").value, p=document.getElementById("inPwd").value;
  const e=document.getElementById("err");
  try{
    guardar(await auth({email:u+"@"+DOMINIO,password:p},"password"));
    localStorage.setItem("md_quien", u);
    document.getElementById("mLogin").style.display="none";
    arrancar();
  }catch(x){ e.textContent="No se pudo entrar. Revisa tu clave."; e.style.display="block" }
}

/* ---------- quienes van al servicio: lider y apoyos ---------- */
function personasDe(x){
  const out=[]; const t=limpio(x.tecnico);
  if(t) out.push(t);
  String(x.auxiliar||"").split(/[,\/;]| y | Y /).forEach(function(a){
    const q=limpio(a); if(q && out.indexOf(q)<0) out.push(q);
  });
  return out;
}
const CERRADO=["ATENDIDO","CANCELADO","PROSPECTO","ATENCION VENTAS"];
const COORDS=[["MANT","Mantenimientos"],["INST","Instalaciones"],["LEV","Levantamientos"],
              ["PRY_ESP","Proyectos especiales"],["CAT","CAT"]];

async function cargar(){
  document.getElementById("cuerpo").innerHTML='<div class="load">Cargando…</div>';
  const de=iso(lunes), a=iso(masDias(lunes,6));
  try{
    const sem=await api("servicios?select=coord,id,tkt,nombre,dependencia,lat,long,"+
      "fecha_servicio,status,tecnico,auxiliar,tipo_servicio"+
      "&fecha_servicio=gte."+de+"&fecha_servicio=lte."+a+"&limit=1000");
    const FUERA="(ATENDIDO,CANCELADO,PROSPECTO,\"ATENCION VENTAS\")";
    D={
      semana: sem,
      atorados: await cuantos("&status=not.in."+FUERA+"&fecha_servicio=lt."+isoDe(-30)),
      sinProgramar: await cuantos("&status=is.null&fecha_servicio=is.null"),
      monitoreo: await api("monitoreo?select=*&order=semana_ini.desc&limit=8")
    };
    pintar();
  }catch(e){
    document.getElementById("cuerpo").innerHTML=
      '<div class="load">No se pudo consultar.<br>'+esc(String(e).slice(0,140))+'</div>';
  }
}
function mover(n){ lunes = n===0 ? lunesDe(new Date()) : masDias(lunes,n); cargar() }

function pintar(){
  const ds=[0,1,2,3,4,5,6].map(i=>masDias(lunes,i));
  document.getElementById("lblSemana").textContent=
    "Semana "+ddmmm(ds[0])+" al "+ddmmm(ds[6])+" de "+ds[6].getFullYear();

  const s=D.semana;
  const cerrado=x=>CERRADO.indexOf(String(x.status||"").toUpperCase())>=0;
  const atendidos=s.filter(x=>String(x.status||"").toUpperCase()==="ATENDIDO").length;
  const abiertos=s.filter(x=>!cerrado(x)).length;
  const gente=new Set(); s.forEach(x=>personasDe(x).forEach(q=>gente.add(q)));
  const sinBrigada=s.filter(x=>!personasDe(x).length).length;

  let h='<div class="tarjetas">'+
    tarjeta(s.length,"servicios con fecha esta semana","")+
    tarjeta(atendidos,"ya atendidos","ok")+
    tarjeta(abiertos,"sin cerrar", abiertos?"ojo":"ok")+
    tarjeta(gente.size,"personas en campo","")+
    tarjeta(D.atorados,"parados más de un mes", D.atorados?"mal":"ok")+
    tarjeta(D.sinProgramar,"capturados sin fecha", D.sinProgramar?"ojo":"ok")+
    '</div>';

  /* por coordinacion */
  h+='<h2>La semana, por coordinación</h2><div class="caja"><table><thead><tr>'+
    '<th>Coordinación</th><th class="num">Servicios</th><th class="num">Atendidos</th>'+
    '<th class="num">Sin cerrar</th><th style="width:34%">Avance</th></tr></thead><tbody>';
  COORDS.forEach(function(c){
    const f=s.filter(x=>x.coord===c[0]);
    if(!f.length) return;
    const at=f.filter(x=>String(x.status||"").toUpperCase()==="ATENDIDO").length;
    const ab=f.filter(x=>!cerrado(x)).length;
    const pct=f.length?Math.round(100*at/f.length):0;
    h+='<tr><td><span class="tag">'+esc(c[0])+'</span> '+esc(c[1])+'</td>'+
      '<td class="num">'+f.length+'</td>'+
      '<td class="num verde">'+at+'</td>'+
      '<td class="num'+(ab?" ambar":"")+'">'+ab+'</td>'+
      '<td><div class="barrita"><i style="width:'+pct+'%"></i></div>'+
      '<span class="sub">'+pct+'%</span></td></tr>';
  });
  h+='</tbody></table>'+
     (sinBrigada?'<div class="sub" style="margin-top:9px">'+sinBrigada+
       ' servicio'+(sinBrigada>1?"s":"")+' de la semana todavía sin brigada asignada.</div>':"")+
     '</div>';

  /* carga por persona */
  const carga={};
  s.forEach(function(x){ personasDe(x).forEach(function(q){ carga[q]=(carga[q]||0)+1 }) });
  const orden=Object.entries(carga).sort((a,b)=>b[1]-a[1]);
  const tope=orden.length?orden[0][1]:1;
  h+='<div class="dos"><div><h2>Quién trae más carga</h2><div class="caja"><table><tbody>'+
    orden.slice(0,10).map(function(p){
      return '<tr><td>'+esc(p[0])+'<div class="barrita"><i style="width:'+
        Math.round(100*p[1]/tope)+'%"></i></div></td>'+
        '<td class="num">'+p[1]+'</td></tr>';
    }).join("")+'</tbody></table>'+
    (orden.length>10?'<div class="sub" style="margin-top:8px">y '+(orden.length-10)+
      ' personas más.</div>':"")+'</div></div>';

  /* monitoreo */
  h+='<div><h2>Centro de monitoreo</h2><div class="caja">';
  if(D.monitoreo && D.monitoreo.length){
    const ini=D.monitoreo[0].semana_ini;
    const z=D.monitoreo.filter(x=>x.semana_ini===ini);
    h+='<table><thead><tr><th>Zona</th><th class="num">Equipos</th>'+
       '<th class="num">En línea</th><th style="width:32%"></th></tr></thead><tbody>'+
      z.map(function(x){
        const pct=x.instalados?Math.round(100*x.en_linea/x.instalados):0;
        const cl=pct>=80?"verde":(pct>=60?"ambar":"rojo");
        return '<tr><td>'+esc(x.zona)+'</td><td class="num">'+x.instalados+'</td>'+
          '<td class="num '+cl+'">'+pct+'%</td>'+
          '<td><div class="barrita"><i style="width:'+pct+'%"></i></div></td></tr>';
      }).join("")+'</tbody></table>'+
      '<div class="sub" style="margin-top:8px">Captura de la semana del '+esc(ini)+
      ', por Ariana.</div>';
  }else{
    h+='<div class="sub">Sin captura de monitoreo.</div>';
  }
  h+='</div></div></div>';

  /* mapa */
  const conMapa=s.filter(x=>Number(x.lat)&&Number(x.long));
  h+='<h2>Dónde se trabajó esta semana</h2>'+
     (conMapa.length?'<div id="mapa"></div>'
       :'<div class="caja"><div class="sub">Ningún servicio de la semana trae coordenadas.</div></div>');
  document.getElementById("cuerpo").innerHTML=h;
  if(conMapa.length) pintarMapa(conMapa);
}
function tarjeta(n,q,cl){
  return '<div class="t '+(cl||"")+'"><div class="n">'+n+'</div><div class="q">'+q+'</div></div>';
}
function pintarMapa(f){
  try{
    mapa=L.map("mapa",{scrollWheelZoom:false}).setView([19.42,-99.14],10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:18, attribution:"OpenStreetMap"}).addTo(mapa);
    const pts=[];
    f.forEach(function(x){
      const la=Number(x.lat), lo=Number(x.long);
      const cerrado=CERRADO.indexOf(String(x.status||"").toUpperCase())>=0;
      L.circleMarker([la,lo],{radius:6, color:"#fff", weight:1.5,
        fillColor: cerrado?"#1E8E5A":"#E8A33D", fillOpacity:.9})
        .bindPopup("<b>"+esc(x.nombre||"")+"</b><br>"+esc(x.coord)+
                   (x.tkt?" · TKT "+esc(x.tkt):"")+"<br>"+esc(x.status||"sin estatus"))
        .addTo(mapa);
      pts.push([la,lo]);
    });
    if(pts.length) mapa.fitBounds(pts,{padding:[30,30]});
  }catch(e){}
}

/* ---------- compartir ----------
   El enlace sirve para quien tiene cuenta. Para direccion, que no la tiene, se
   descarga una copia del tablero tal como se ve: un archivo suelto que se abre
   sin clave y sin conexion. Asi los datos salen solo cuando se decide, en vez
   de quedar publicados en una direccion abierta. */
function compartir(){
  const c=document.getElementById("compartirCaja");
  c.innerHTML='<div class="caja" style="margin-bottom:16px">'+
    '<b>Compartir este tablero</b>'+
    '<div class="sub" style="margin:5px 0 11px">El enlace solo abre para quien tiene '+
    'cuenta. Para dirección, descarga la copia: es un archivo que se abre sin clave.</div>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
    '<button onclick="copiarEnlace()">📋 Copiar enlace</button>'+
    '<button class="pri" onclick="descargar()">⬇ Descargar para enviar</button>'+
    '<button onclick="document.getElementById(\'compartirCaja\').innerHTML=\'\'" '+
    'style="margin-left:auto">Cerrar</button></div>'+
    '<div id="compartirAviso"></div></div>';
}
function copiarEnlace(){
  const u=location.href.split("?")[0];
  const av=document.getElementById("compartirAviso");
  navigator.clipboard.writeText(u).then(
    function(){ av.innerHTML='<div class="bien">Enlace copiado: '+esc(u)+'</div>' },
    function(){ av.innerHTML='<div class="aviso" style="margin-top:10px">No se pudo copiar. '+
      'El enlace es: '+esc(u)+'</div>' });
}
function descargar(){
  const av=document.getElementById("compartirAviso");
  try{
    const cuerpo=document.getElementById("cuerpo").cloneNode(true);
    /* el mapa no viaja: sus imagenes se bajan de internet y en el archivo
       suelto saldria en blanco. Se dice, en vez de dejar un hueco */
    const m=cuerpo.querySelector("#mapa");
    if(m) m.outerHTML='<div class="caja"><div class="sub">El mapa se ve en la '+
      'versión en línea del tablero.</div></div>';
    const estilos=document.querySelector("style").outerHTML;
    const cuando=new Date().toLocaleString("es-MX");
    const html='<!doctype html><html lang="es"><head><meta charset="utf-8">'+
      '<title>Tablero · Área de Servicios e Instalaciones</title>'+estilos+'</head><body>'+
      '<div class="wrap"><header><div class="brand">'+
      '<svg width="27" height="27" viewBox="0 0 100 100"><path d="M50 8 L92 88 L8 88 Z" '+
      'fill="none" stroke="#63B3FF" stroke-width="11" stroke-linejoin="round"/></svg>'+
      '<div><div class="bt">MD Control</div><div class="bs">ÁREA DE SERVICIOS E INSTALACIONES</div></div>'+
      '</div></header>'+
      '<div class="periodo">'+esc(document.getElementById("lblSemana").textContent)+'</div>'+
      '<div class="sub" style="margin-bottom:16px">Copia tomada el '+esc(cuando)+'.</div>'+
      cuerpo.innerHTML+'</div></body></html>';
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
    a.download="Tablero_Area_Servicios_"+iso(lunes)+".html";
    a.click();
    av.innerHTML='<div class="bien">Listo. Se descargó el archivo; mándalo por correo '+
      'o WhatsApp y se abre sin clave.</div>';
  }catch(e){
    av.innerHTML='<div class="aviso" style="margin-top:10px">No se pudo generar la copia.</div>';
  }
}

function arrancar(){
  document.getElementById("barra").style.display="flex";
  document.getElementById("who").innerHTML="<b>"+esc(nombreDe(ses.usuario))+"</b>salir";
  lunes=lunesDe(new Date());
  cargar();
}
(async function(){
  const sel=document.getElementById("inUsr");
  const u=localStorage.getItem("md_quien");
  if(u && sel.querySelector('option[value="'+u+'"]')) sel.value=u;
  if(!ses) return;
  let sirve=await renovar();
  if(!sirve){
    try{ await api("servicios?select=id&limit=1"); sirve=true }catch(e){ sirve=false }
  }
  if(sirve){ document.getElementById("mLogin").style.display="none"; arrancar(); return }
  localStorage.removeItem("md_tablero"); localStorage.removeItem("md_web"); ses=null;
  const e=document.getElementById("err");
  if(e){ e.textContent="Tu sesión venció. Vuelve a entrar con tu clave."; e.style.display="block" }
})();
</script>
