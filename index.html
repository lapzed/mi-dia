/* ============ camara con encuadre ============
   Todas las fotos salen de 1200x900: se recorta lo que quedo dentro del
   recuadro amarillo. Asi el informe deja de verse disparejo y basta una foto
   por partida en vez de varias "por si acaso". */
const FOTO_W = 1200, FOTO_H = 900;      // 4:3, el mismo que el recuadro
let camStream = null, camDestino = null, camFrontal = false, camPendiente = null;
let camPorQue = "";     // por que no abrio, para poder decirlo
let camGuiaAct = null;  // cuanto debe ocupar la pieza en el encuadre actual

function camSoportada(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
            window.isSecureContext);
}

async function camAbrir(campo, titulo, pista, guia){
  camDestino = {campo:campo};
  document.getElementById("camTit").textContent = titulo || "";
  if(pista) document.getElementById("camPista").textContent = pista;
  camGuiaAct = guia || null;
  const g = document.getElementById("camGuia");
  if(guia){ g.style.display="block"; g.style.width=guia+"%"; g.style.aspectRatio="4/3" }
  else g.style.display="none";
  document.getElementById("cam").classList.add("on");
  document.getElementById("camAviso").style.display = "none";
  /* Se pide de lo mas exigente a lo mas simple. Varios Android rechazan de un
     golpe la peticion completa (resolucion + camara trasera) en vez de darte lo
     que puedan, y entonces no abre nada. */
  const intentos = [
    {video:{facingMode: camFrontal?"user":{ideal:"environment"},
            width:{ideal:1920}, height:{ideal:1440}}, audio:false},
    {video:{facingMode: camFrontal?"user":"environment"}, audio:false},
    {video:true, audio:false}
  ];
  for(const req of intentos){
    try{
      camStream = await navigator.mediaDevices.getUserMedia(req);
      const v = document.getElementById("camVideo");
      v.srcObject = camStream;
      await v.play();
      return true;
    }catch(e){ camPorQue = e && (e.name||e.message) }
  }
  // no se pudo: se sigue por el camino de siempre, que recorta igual
  camCerrar();
  camNativo(campo);
  return false;
}

/* la camara del sistema, cuando la de la app no esta disponible */
function camNativo(campo){
  if(campo==="__part__" && camPendiente){
    const inp = document.getElementById("inPart");
    inp.dataset.etapa = camPendiente.etapa || "ANTES";
    inp.dataset.pid = camPendiente.pid;
    inp.dataset.variante = camPendiente.variante||"";
    inp.click();
  }else{
    const inp = document.getElementById("in_"+campo+"_cam");
    if(inp) inp.click();
  }
}

function camGirar(){
  camFrontal = !camFrontal;
  const d = camDestino;
  camCerrar();
  if(d) camAbrir(d.campo, document.getElementById("camTit").textContent, null, camGuiaAct);
}

function camCerrar(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null }
  document.getElementById("cam").classList.remove("on");
  document.getElementById("camVideo").srcObject = null;
}

/* El video se muestra recortado a la pantalla (object-fit:cover), asi que hay
   que traducir el recuadro de la pantalla a coordenadas del video real. */
function camRecorte(){
  const v = document.getElementById("camVideo");
  const vis = document.querySelector(".cam-vis").getBoundingClientRect();
  const mar = document.querySelector(".cam-marco").getBoundingClientRect();
  const esc = Math.max(vis.width / v.videoWidth, vis.height / v.videoHeight);
  const offX = (vis.width  - v.videoWidth  * esc) / 2;
  const offY = (vis.height - v.videoHeight * esc) / 2;
  return {sx:(mar.left - vis.left - offX)/esc, sy:(mar.top - vis.top - offY)/esc,
          sw:mar.width/esc, sh:mar.height/esc};
}

async function camDisparar(){
  const v = document.getElementById("camVideo");
  if(!v.videoWidth) return;
  const r = camRecorte();
  const c = document.createElement("canvas");
  c.width = FOTO_W; c.height = FOTO_H;
  c.getContext("2d").drawImage(v, r.sx, r.sy, r.sw, r.sh, 0, 0, FOTO_W, FOTO_H);
  const blob = await new Promise(res=>c.toBlob(res, "image/jpeg", 0.72));
  const foto = {blob:blob, url:URL.createObjectURL(blob),
                tipoMime:"image/jpeg", nombre:"foto.jpg"};
  // primero se ve en grande: en la miniatura no se nota si salió movida
  verPrevia(foto, camDestino.campo, camPendiente,
            document.getElementById("camTit").textContent);
}

/* ---------- vista previa ----------
   Una foto borrosa o de lejos no sirve de evidencia, y al cliente le llega así.
   Vale más revisarla en el momento, con el equipo enfrente, que descubrirlo en
   la oficina cuando ya nadie puede volver al sitio. */
let previaDato = null;
function verPrevia(foto, campo, pend, titulo){
  previaDato = {foto:foto, campo:campo, pend:pend ? Object.assign({}, pend) : null};
  document.getElementById("previaImg").src = foto.url;
  document.getElementById("previaTit").textContent = titulo || "";
  document.getElementById("cam").classList.remove("on");   // se aparta la cámara
  document.getElementById("previa").classList.add("on");
}
function cerrarPrevia(){
  document.getElementById("previa").classList.remove("on");
  document.getElementById("previaImg").src = "";
  document.getElementById("barraNueva").style.display = "";
  document.getElementById("barraRevisar").style.display = "none";
  revisando = null;
}

/* ver en grande una foto ya cargada, y borrarla desde ahí si no sirve */
let revisando = null;
function verGrande(url, titulo, alBorrar){
  revisando = {alBorrar:alBorrar};
  document.getElementById("previaImg").src = url;
  document.getElementById("previaTit").textContent = titulo || "";
  document.getElementById("barraNueva").style.display = "none";
  document.getElementById("barraRevisar").style.display = "";
  document.getElementById("previa").classList.add("on");
}
function previaBorrar(){
  const r = revisando;
  cerrarPrevia();
  if(r && r.alBorrar) r.alBorrar();
}
function previaUsar(){
  const d = previaDato; previaDato = null;
  cerrarPrevia(); camCerrar(); camPendiente = null;
  if(!d) return;
  if(d.campo==="__part__" && d.pend){
    d.foto.variante = d.pend.variante;
    cie.partidas[d.pend.etapa][d.pend.pid].push(d.foto);
  }else{
    cie[d.campo].push(d.foto);
  }
  pintarCierre();
}
function previaRepetir(){
  const d = previaDato; previaDato = null;
  cerrarPrevia();
  if(!d) return;
  URL.revokeObjectURL(d.foto.url);
  // se vuelve a abrir la cámara en la misma pieza, sin perder el paso
  if(d.campo==="__part__" && d.pend) partAgregar(d.pend.etapa, d.pend.pid);
  else if(camSoportada()) camAbrir(d.campo, document.getElementById("camTit").textContent);
  else camNativo(d.campo);
}
function previaDescartar(){
  const d = previaDato; previaDato = null;
  cerrarPrevia(); camCerrar(); camPendiente = null;
  if(d) URL.revokeObjectURL(d.foto.url);
  pintarCierre();
}

/* un solo camino para las fotos: el visor con recuadro y, si el telefono no lo
   permite, la camara de siempre (que se recorta igual al guardarse) */
function abrirFoto(campo, titulo, pista){
  if(camSoportada()){ camPendiente = null; camAbrir(campo, titulo, pista) }
  else document.getElementById("in_"+campo+"_cam").click();
}

/* respaldo cuando el telefono no deja abrir la camara dentro de la app */
async function agregarPartida(input){
  const etapa = input.dataset.etapa || (camPendiente && camPendiente.etapa) || "ANTES";
  const pid = input.dataset.pid, variante = input.dataset.variante||"";
  const files = [...input.files]; input.value = "";
  for(const f of files){
    try{
      const blob = await recortarCentro(f);
      cie.partidas[etapa][pid].push({blob:blob, url:URL.createObjectURL(blob),
        tipoMime:blob.type||"image/jpeg", nombre:f.name, variante:variante});
    }catch(e){ toast("No se pudo leer una imagen", true) }
  }
  pintarCierre();
}

/* Las que llegan de la galeria se recortan al centro con la misma proporcion,
   para que no desentonen con las tomadas con el recuadro. */
async function recortarCentro(file){
  if(file.type==="application/pdf") return file;
  const img = await createImageBitmap(file);
  const objetivo = FOTO_W / FOTO_H;
  let sw = img.width, sh = Math.round(img.width / objetivo);
  if(sh > img.height){ sh = img.height; sw = Math.round(img.height * objetivo) }
  const c = document.createElement("canvas");
  c.width = FOTO_W; c.height = FOTO_H;
  c.getContext("2d").drawImage(img, Math.round((img.width-sw)/2),
    Math.round((img.height-sh)/2), sw, sh, 0, 0, FOTO_W, FOTO_H);
  return await new Promise(r=>c.toBlob(r, "image/jpeg", 0.72));
}

async function agregar(input, campo){
  const files=[...input.files]; input.value="";
  for(const f of files){
    try{
      const blob=await recortarCentro(f);
      cie[campo].push({blob:blob, url:URL.createObjectURL(blob),
                       tipoMime:blob.type, nombre:f.name});
    }catch(e){ toast("No se pudo leer una imagen",true) }
  }
  pintarCierre();
}

/* las fotos del celular pesan 3-6 MB; se reducen antes de subir porque en campo
   la señal es mala y el bucket tiene tope de 8 MB por archivo */
async function comprimir(file){
  if(file.type==="application/pdf") return file;
  const img=await createImageBitmap(file);
  const k=Math.min(1, 1400/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.62));
}

  }

    return;

  if(cie.estatus!=="REPROGRAMADO"){
    const faltan=cie._bloques.filter(b=>!cubierto(b));
    if(faltan.length){
      toast("Falta: "+faltan.map(b=>b.titulo.replace(/^\d+ · /,"")).join(", "),true);
      return;
    }
  }
  const btn=document.getElementById("btnGo");
  btn.disabled=true; btn.textContent="Guardando…";
  guardarCierre(s, cie.estatus, com);
}

/* ============ guardar (con cola sin señal) ============ */
async function subirArchivo(item, blob, tipo, i){
  const ext = blob.type==="application/pdf" ? "pdf" : "jpg";
  // el tipo puede venir compuesto (ANTES|TROMPETA|PLASTICO); en el nombre del
  // archivo las barras no sirven, pero en la base se guarda completo
  const enNombre = String(tipo).replace(/\|/g, "-");
  const ruta = `${item.coord}/${item.tkt||("id"+item.id)}/${Date.now()}_${enNombre}_${i}.${ext}`;
  // sin upsert: una evidencia nunca debe pisar a otra. Si la ruta ya existiera
  // —no deberia, lleva la hora al milisegundo— es mejor que falle y se reintente
  // que perder la foto anterior.
  const r = await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${ruta}`,
    {method:"POST", headers:Object.assign({},HDR,{"Content-Type":blob.type}),
     body:blob});
  if(!r.ok) throw new Error("storage "+r.status);
  await api("evidencias",{method:"POST",body:JSON.stringify({
    coord:item.coord, servicio_id:item.id, tkt:item.tkt||"", tipo:tipo,
    ruta:ruta, tecnico:item.tecnico})});
  return ruta;
}

/* Las fotos se subían de una en una y esperando cada respuesta. Con diez fotos
   y una antena de sótano eso son diez viajes en fila, que es lo que se sentía
   lentísimo. Se suben de tres en tres: mientras una espera respuesta las otras
   ya van en camino. Más de tres en un celular con mala señal empeora, porque se
   pelean el mismo canal. */
const A_LA_VEZ = 3;
async function subirEnParalelo(tareas, avisa){
  let hechas = 0, siguiente = 0;
  async function obrero(){
    while(siguiente < tareas.length){
      const mia = tareas[siguiente++];
      await mia();
      hechas++;
      if(avisa) avisa(hechas, tareas.length);
    }
  }
  await Promise.all(Array.from({length: Math.min(A_LA_VEZ, tareas.length)}, obrero));
}

async function enviarCierre(item, avisa){
  // primero las evidencias: si fallan, el TKT no debe quedar cerrado sin respaldo
  const tareas = [];
  for(const [campo,tipo] of (item.campos||[])){
    const arr=item[campo]||[];
    arr.forEach((blob,i)=>tareas.push(()=>subirArchivo(item, blob, tipo, i)));
  }
  for(const p of (item.partidas||[])) tareas.push(()=>subirArchivo(item, p.blob, p.tipo, p.n));
  await subirEnParalelo(tareas, avisa);
  for(const pr of (item.propuestas||[])){
    await api("propuestas?on_conflict=coord,servicio_id,n",
      {method:"POST",
       headers:{Prefer:"resolution=merge-duplicates"},
       body:JSON.stringify(Object.assign({coord:item.coord, servicio_id:item.id,
                                          capturo:item.tecnico}, pr))});
  }
  if(Object.keys(item.body||{}).length){
    await api(`servicios?coord=eq.${encodeURIComponent(item.coord)}&id=eq.${item.id}`,
              {method:"PATCH", body:JSON.stringify(item.body)});
  }

  // al dar la obra por terminada, los días que quedaban programados se cancelan
  // (solo los que nadie ha tocado, para no borrar trabajo registrado)
  if(item.modo==="FIN_OBRA" && item.obra){
    await api("servicios?obra=eq."+encodeURIComponent(item.obra)+
              "&dia_n=gt."+item.dia_n+"&status=eq.PROGRAMADO",
      {method:"PATCH", body:JSON.stringify({status:"CANCELADO",
        obs_coord:"Obra terminada el "+fecha+" en el día "+item.dia_n})});
  }

  await api("log",{method:"POST",body:JSON.stringify({
    timestamp:item.ts, usuario:item.tecnico, win_user:"app", coord:item.coord,
    rol:"TECNICO", etapa:"4", tkt:item.tkt||"",
    accion:"APP: "+(item.modo||item.body.status),
    detalle:"id="+item.id+(item.obra?" · "+item.obra+" dia "+item.dia_n:"")+" · "+
            (item.campos||[]).map(([c,t])=>t.toLowerCase()+"="+(item[c]||[]).length).join(" ")+
            (item.nota?" · "+item.nota:"")})});
}

async function guardarCierre(s, modo, com){
  /* cada modo escribe distinto: el día que avanza queda en continuidad, el que
     no se pudo también pero marcado para cobro, y solo el cierre de la obra
     queda atendido */
  const body={};
  if(modo==="REGULARIZAR"){
    /* ni status ni fecha_atencion: el servicio ya estaba cerrado y su fecha es
       la que fue. Lo único que puede enriquecerse es el inventario. */
  }else if(modo==="ATENDIDO" || modo==="FIN_OBRA"){
    body.status="ATENDIDO"; body.fecha_atencion=fecha;
  }else if(modo==="CONTINUIDAD"){
    body.status="CONTINUIDAD"; body.fecha_atencion=fecha;
  }else{
    body.status=modo;
  }
  if(com) body.obs_coord=com;
  /* el avance que declara el instalador, con el sello de cuando lo dijo */
  if(esObra(cie.srv) && (modo==="CONTINUIDAD" || modo==="FIN_OBRA")){
    body.avance_tec = (modo==="FIN_OBRA") ? 100 : Number(cie.avancePct||0);
    body.avance_ts  = new Date().toISOString().slice(0,16).replace("T"," ");
    if(com) body.avance_nota = com;
  }
  if(cie.log && cie.log.estado){
    body.log_estado = cie.log.estado;
    body.log_saltos = cie.log.estado==="SALTEADO" ? (cie.log.saltos||"") : "";
    if((cie.log.ultimo||"").trim()) body.log_ultimo = cie.log.ultimo.trim();
    if((cie.log.canal||"").toString().trim()) body.canal = cie.log.canal.toString().trim();
    const b = parseInt(cie.log.barras, 10);
    if(!isNaN(b)) body.senal_barras = b;
  }
  /* La evidencia se registra a nombre de la BRIGADA del servicio cuando quien
     sube es de una empresa externa: su administrativo se llama "Sore", pero la
     política pide `es_mio(tecnico)` sobre sus brigadas —"Sore Externo 1"— y así
     la subida se rechazaba. Para un técnico no cambia nada: es su propio nombre. */
  const firmaEv = (ses && ses.rol === "EXTERNO" && limpio(s.tecnico))
                  ? String(s.tecnico).trim() : tecnico;
  const item={id:s.id, coord:s.coord, tkt:s.tkt||"", body:body, nota:com, modo:modo,
              obra:s.obra||"", dia_n:s.dia_n||0,
              tecnico:firmaEv, ts:new Date().toISOString().slice(0,19).replace("T"," ")};
  item.campos = cie._bloques.map(b=>[b.campo, b.tipo]);
  cie._bloques.forEach(b=>{ item[b.campo]=cie[b.campo].map(f=>f.blob) });
  /* el inventario: cada foto viaja sabiendo de que pieza es —el informe la
     titula con eso— y el conteo se escribe en el servicio, que es el dato que
     hasta hoy se capturaba a mano */
  /* las propuestas viajan con el cierre: si no hay señal se guardan en el
     teléfono junto con las fotos y suben después, igual que todo lo demás */
  if(cie.propuestas){
    item.propuestas = cie.propuestas
      .filter(p=>Object.keys(p).some(k=>!["n","nombre"].includes(k) && (p[k]||"").toString().trim()))
      .map(p=>Object.assign({}, p));
  }
  if(cie.partidas){
    item.partidas = [];
    for(const etapa of ETAPAS_PART){
      if(!cie.partidas[etapa]) continue;
      for(const p of PARTIDAS){
        cie.partidas[etapa][p.id].forEach((f,i)=>{
          item.partidas.push({
            tipo: etapa+"|"+p.id+(f.variante?"|"+f.variante.toUpperCase():""),
            blob: f.blob, n: i+1});
        });
      }
    }
    Object.assign(body, conteoPartidas());
    /* lo que el técnico declaró gana: él es quien tiene el sitio enfrente */
    if(cie.inv){
      if(limpio(cie.inv.equipo)) body.equipo = cie.inv.equipo.trim();
      if(limpio(cie.inv.serie))  body.serie  = cie.inv.serie.trim();
      if(limpio(cie.inv.obs_medicion)) body.obs_medicion = cie.inv.obs_medicion.trim();
    if(limpio(cie.inv.software_ver)) body.software_ver = cie.inv.software_ver.trim();
    if(cie.inv.ubicaciones && Object.keys(cie.inv.ubicaciones).length)
      body.ubicaciones = cie.inv.ubicaciones;
    INVENTARIO.concat(MEDICIONES).forEach(([k])=>{
        const v=String(cie.inv[k]==null?"":cie.inv[k]).trim();
        if(v!=="") body[k]=v;
      });
    }
  }
  const listos={ATENDIDO:"Servicio cerrado ✓", FIN_OBRA:"Instalación concluida ✓",
                CONTINUIDAD:"Avance guardado · la obra sigue abierta ✓",
                REPROGRAMADO:"Reprogramado ✓"};
  try{
    // el botón va diciendo por dónde va: sin eso, subir ocho fotos parece que
    // se trabó y el técnico le pica otra vez
    await enviarCierre(item, (n,total)=>{
      const b=document.getElementById("btnGo");
      if(b && total>1) b.textContent=`Subiendo foto ${n} de ${total}…`;
    });
    toast(listos[modo]||"Guardado ✓");
    cerrarHoja(); cargar();
  }catch(e){
    try{
      await colaAdd(item);
      s.status=body.status;
      if(body.fecha_atencion){
        s.fecha_atencion=fecha;
        s._ev=s._ev||{};
        (item.campos||[]).forEach(([c,t])=>{ if((item[c]||[]).length) s._ev[t]=true });
      }
      if(com) s.obs_coord=com;
      toast("Sin señal · se guardó con sus fotos y subirá solo",true);
      cerrarHoja(); pintarDias(); pintar(); pintarPendientes();
    }catch(e2){
      toast("No se pudo guardar: "+String(e2).slice(0,60),true);
      const b=document.getElementById("btnGo");
      if(b){ b.disabled=false; b.textContent="Reintentar" }
    }
  }
}

/* ============ cola sin señal (IndexedDB: guarda las fotos completas) ============ */
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("mdcontrol",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("cola",{keyPath:"key",autoIncrement:true}) };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function colaAdd(item){
  const db=await idb();
  return new Promise((res,rej)=>{
    const t=db.transaction("cola","readwrite");
    t.objectStore("cola").add(item);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);
  });
}
async function colaTodo(){
  const db=await idb();
  return new Promise((res,rej)=>{
    const q=db.transaction("cola","readonly").objectStore("cola").getAll();
    q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
  });
}
async function colaQuita(key){
  const db=await idb();
  return new Promise((res)=>{
    const t=db.transaction("cola","readwrite");
    t.objectStore("cola").delete(key); t.oncomplete=()=>res();
  });
}

async function pintarPendientes(){
  let n=0; try{ n=(await colaTodo()).length }catch(e){}
  const el=document.getElementById("cola");
  el.style.display = n?"block":"none";
  if(n) el.textContent="⏳ "+n+" cierre(s) esperando señal · se suben solos";
}

let sincronizando=false;
async function sincronizar(avisar){
  if(sincronizando) return; sincronizando=true;
  try{
    const items=await colaTodo();
    let subidos=0;
    for(const it of items){
      try{ await enviarCierre(it); await colaQuita(it.key); subidos++ }catch(e){}
    }
    if(subidos){
      if(avisar) toast(subidos+" cierre(s) pendientes ya subieron ✓");
      await cargar();
    }
    await pintarPendientes();
  } finally { sincronizando=false }
}

/* ============ arranque ============ */
window.addEventListener("online", ()=>sincronizar(true));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sincronizar(true) });
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});

async function arrancarSesion(){
  pintarDias();
  // los alias pueden haber cambiado desde la ultima vez; si no hay red se usan
  // los que quedaron guardados en el telefono
  try{ await cargarVariantes() }catch(e){}
  await cargar();
  sincronizar(false);
}

(async function(){
  pintarPendientes();
  if(!ses){
    document.getElementById("mTec").style.display="flex";
    llenarUsuarios();
    return;
  }
  if(ses.rol==="ADMINISTRATIVO"){ location.href="entregables.html"; return }
  /* Esta pantalla es de tecnicos, y tambien de los administrativos de las
     empresas externas: ellos llevan los servicios de sus brigadas y los cierran
     desde aqui. Lo que ven lo decide la base -es_mio(tecnico) sobre sus alias-,
     no esta pantalla. Cualquier otra sesion —una estacion, ventas— no entra
     prestada: se pide la clave del tecnico. */
  if(ses.rol!=="TECNICO" && ses.rol!=="EXTERNO"){
    ses=null; localStorage.removeItem("md_tec");
    document.getElementById("mTec").style.display="flex";
    llenarUsuarios();
    return;
  }
  tecnico = ses.nombre || tecnico;
  await renovar();            // el token guardado casi siempre ya vencio
  await arrancarSesion();
})();
