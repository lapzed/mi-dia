<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2038">
<title>MD Control · Mi día</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0B2038; --bg2:#0E2A47; --card:#12314F; --line:#1D4267;
    --txt:#EAF2FB; --txt2:#9DB6D2; --txt3:#6E8CAD;
    --acc:#63B3FF; --ok:#1E8E5A; --warn:#E8A33D; --bad:#C6413B;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0B2038,#0E2A47);
    border-bottom:1px solid var(--line);padding:12px 14px 10px;margin:0 -14px 12px}
  .brand{display:flex;align-items:center;gap:10px}
  .tri{width:26px;height:26px;flex:0 0 auto}
  .bt{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .bs{font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.04em}
  .who{margin-left:auto;text-align:right;font-size:11px;color:var(--txt2);cursor:pointer}
  .who b{display:block;color:var(--txt);font-size:12px;max-width:140px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  .days{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;min-width:56px;text-align:center;padding:6px 8px;border-radius:11px;
    background:#0F2C4A;border:1px solid var(--line);cursor:pointer}
  .day .d{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em}
  .day .n{font-size:16px;font-weight:700}
  .day.on{background:var(--acc);border-color:var(--acc);color:#07203a}
  .day.on .d{color:#0a2c4d}
  .day .dot{width:5px;height:5px;border-radius:50%;background:var(--warn);margin:2px auto 0}
  .day.on .dot{background:#07203a}
  .day.ido{opacity:.5}
  .day.ido.on{opacity:1}

  .sum{display:flex;gap:8px;margin-bottom:12px}
  .pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 10px;text-align:center}
  .pill .v{font-size:19px;font-weight:800}
  .pill .l{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
  .card.done{opacity:.62}
  .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--txt3)}
  .stripe.ok{background:var(--ok)} .stripe.re{background:var(--warn)} .stripe.pe{background:var(--acc)}
  .row1{display:flex;align-items:baseline;gap:9px;margin-left:6px}
  .hora{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
    background:#17456E;color:var(--acc);letter-spacing:.03em}
  .st{margin-left:auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
  .st.ok{background:rgba(30,142,90,.22);color:#5BD79B}
  .st.re{background:rgba(232,163,61,.2);color:#F0BE6E}
  .st.pe{background:rgba(99,179,255,.16);color:var(--acc)}
  .sitio{margin:5px 0 1px 6px;font-size:15px;font-weight:700}
  .dep{margin-left:6px;font-size:12px;color:var(--txt2)}
  .dir{margin:7px 0 0 6px;font-size:12px;color:var(--txt2);display:flex;gap:6px}
  .dir svg{flex:0 0 auto;margin-top:2px}
  .nota{margin:8px 0 0 6px;font-size:12px;background:rgba(232,163,61,.12);
    border-left:3px solid var(--warn);padding:7px 9px;border-radius:0 8px 8px 0;color:#F2D9AC}
  .cont{margin:8px 0 0 6px;font-size:12px;color:var(--txt2)}
  .etapas{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0 6px}
  .etapas span{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
  .etapas .ok{background:rgba(30,142,90,.2);color:#5BD79B}
  .etapas .falta{background:rgba(232,163,61,.15);color:#F0BE6E}

  .acts{display:flex;gap:7px;margin:11px 0 0 6px;flex-wrap:wrap}
  button{font:inherit;border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;
    font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .b-map,.b-tel{background:#17456E;color:var(--acc)}
  .b-ok{background:var(--ok);color:#fff;flex:1;justify-content:center}
  .b-re{background:var(--warn);color:#3a2600;justify-content:center}
  .b-gh{background:#17456E;color:var(--acc);flex:1;justify-content:center}
  .b-fin{background:var(--ok);color:#fff;justify-content:center}
  .equipo{margin:8px 0 0 6px;font-size:11.5px;color:#9FE1CB;
    background:rgba(30,142,90,.12);border-left:3px solid var(--ok);
    padding:6px 9px;border-radius:0 8px 8px 0}
  .logev{margin:8px 0 0 6px;font-size:11.5px;padding:6px 9px;border-radius:0 8px 8px 0}
  .logev.bien{color:#9FE1CB;background:rgba(30,142,90,.12);border-left:3px solid var(--ok)}
  .logev.mal{color:#F0BE6E;background:rgba(232,163,61,.14);border-left:3px solid var(--warn)}
  .obra{margin:3px 0 0 6px;font-size:11.5px;color:var(--acc);font-weight:600}
  .obra b{color:#F0BE6E}
  .ojo{background:rgba(99,179,255,.12);border:1px solid rgba(99,179,255,.35);
    color:#AFD6FF;border-radius:11px;padding:10px 12px;font-size:12px;margin-bottom:12px}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45}

  .cola{background:rgba(232,163,61,.14);border:1px solid rgba(232,163,61,.4);color:#F0BE6E;
    border-radius:11px;padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:10px}
  .vacio{text-align:center;color:var(--txt2);padding:44px 16px}
  .vacio .em{font-size:40px;margin-bottom:8px}
  .load{text-align:center;padding:30px;color:var(--txt2);font-size:13px}

  /* ---------- hojas modales ---------- */
  .modal{position:fixed;inset:0;background:rgba(5,16,28,.94);z-index:50;
    display:flex;align-items:flex-end;justify-content:center}
  .box{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:18px;width:100%;max-width:640px;max-height:94vh;overflow-y:auto;
    padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  @media(min-width:641px){.modal{align-items:center}.box{border-radius:18px}}
  .box h2{margin:0 0 3px;font-size:17px}
  .box p.sub{margin:0 0 14px;font-size:12.5px;color:var(--txt2)}
  select,textarea,input[type=text],input[type=password],input:not([type]){
    width:100%;padding:12px;border-radius:11px;background:#0F2C4A;color:var(--txt);
    border:1px solid var(--line);font:inherit;font-size:14px;margin-bottom:12px}
  textarea{min-height:86px;resize:vertical}
  .b-full{width:100%;justify-content:center;background:var(--acc);color:#07203a;padding:13px;font-size:14px}
  .b-gris{width:100%;justify-content:center;background:#17456E;color:var(--txt2);padding:11px;margin-top:8px}

  .lbl{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;
    letter-spacing:.05em;margin:2px 0 7px;display:flex;align-items:center;gap:7px}
  .req{color:var(--warn);font-size:10px;background:rgba(232,163,61,.16);
    padding:2px 7px;border-radius:20px;letter-spacing:0;text-transform:none}
  .listo{color:#5BD79B;background:rgba(30,142,90,.2)}

  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;
    color:var(--txt2);font-size:12.5px;margin-bottom:12px;cursor:pointer}
  .drop.ok{border-color:var(--ok);border-style:solid;background:rgba(30,142,90,.08)}
  .drop .big{font-size:26px;display:block;margin-bottom:4px}
  .dos{display:flex;gap:8px;margin-bottom:10px}
  .b-cam,.b-gal{flex:1;justify-content:center;padding:13px 8px;font-size:13px;
    border:1.5px dashed var(--line);background:#0F2C4A;color:var(--txt2)}
  .b-cam{border-style:solid;background:#17456E;color:var(--acc)}
  /* ---------- camara con encuadre ----------
     La camara del celular no deja dibujar nada encima, asi que el visor va
     dentro de la app: se ve el recuadro y al disparar se recorta EXACTAMENTE lo
     que quedo dentro. Por eso todas las fotos salen del mismo tamano. */
  .cam{position:fixed;inset:0;z-index:120;background:#000;display:none;
       flex-direction:column}
  .cam.on{display:flex}
  .cam-vis{position:relative;flex:1;overflow:hidden}
  .cam-vis video{width:100%;height:100%;object-fit:cover;display:block}
  .cam-marco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:86%;aspect-ratio:4/3;border:3px solid #FFC61A;border-radius:8px;
    box-shadow:0 0 0 3000px rgba(0,0,0,.45);pointer-events:none}
  /* guia de adentro: cuanto debe ocupar la pieza. El marco fija el tamano de la
     foto; la guia dice si se pide detalle (llenarla) o ubicacion (dejar
     alrededor lo que la rodea) */
  .cam-guia{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    border:2px dashed rgba(255,255,255,.75);border-radius:6px;pointer-events:none}
  .cam-marco i{position:absolute;width:20px;height:20px;border:4px solid #FFC61A}
  .cam-marco i.a{left:-3px;top:-3px;border-right:none;border-bottom:none}
  .cam-marco i.b{right:-3px;top:-3px;border-left:none;border-bottom:none}
  .cam-marco i.c{left:-3px;bottom:-3px;border-right:none;border-top:none}
  .cam-marco i.d{right:-3px;bottom:-3px;border-left:none;border-top:none}
  .cam-tit{position:absolute;left:0;right:0;top:14px;text-align:center;color:#fff;
    font-size:15px;font-weight:800;text-shadow:0 1px 6px #000;padding:0 16px}
  .cam-pista{position:absolute;left:0;right:0;bottom:14px;text-align:center;
    color:#FFE9A6;font-size:12.5px;text-shadow:0 1px 6px #000;padding:0 22px}
  .cam-barra{display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px calc(14px + env(safe-area-inset-bottom));background:#000}
  .cam-barra button{background:none;border:none;color:#EAF2FB;font-size:13.5px;
    font-weight:700;padding:10px}
  .cam-disparo{width:66px;height:66px;border-radius:50%;background:#fff;
    border:4px solid #9DB6D2 !important;padding:0 !important}
  .cam-aviso{color:#F0A9A5;font-size:12.5px;text-align:center;padding:14px 20px}

  /* ---------- inventario por piezas ---------- */
  .part{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:9px;
    background:#0F2C4A}
  .part.lista{border-color:rgba(30,142,90,.55);background:rgba(30,142,90,.07)}
  .part-cab{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:13.5px}
  .part-cab b{font-weight:700}
  .part-cab .cta{margin-left:auto;font-size:11px;font-weight:800;color:#5BD79B;
    background:rgba(30,142,90,.2);border-radius:20px;padding:2px 9px}
  .part-cab .req{margin-left:auto}
  .part-acc{display:flex;gap:7px;align-items:center}
  .b-part{flex:1;justify-content:center;padding:11px 8px;font-size:13px;
    border:1.5px solid var(--line);background:#17456E;color:var(--acc)}
  .pz-tipo{flex:0 0 auto;max-width:44%;font-size:12.5px;padding:8px 9px}
  .pz-serie{width:100%;margin-top:8px;font-size:12.5px;padding:9px 10px}
  .pzs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .pz{position:relative;width:74px}
  .pz img{width:74px;height:56px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);display:block}
  .pz span{display:block;font-size:9.5px;color:var(--txt2);text-align:center;
    margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pz button{position:absolute;top:-6px;right:-6px;width:21px;height:21px;padding:0;
    border-radius:50%;background:var(--bad);color:#fff;font-size:12px;line-height:1}

  /* la camara es lo de siempre en campo; la galeria solo para servicios pasados */
  .b-cam.solo{display:flex;width:100%;justify-content:center;padding:15px 8px;font-size:14.5px}
  .liga-gal{display:block;width:100%;background:none;border:none;padding:9px 0 12px;
    font-size:12.5px;font-weight:600;color:var(--txt2);text-decoration:underline;
    text-underline-offset:3px}
  .ya{font-size:11.5px;color:#5BD79B;margin:-4px 0 10px}

  /* aviso de que se está trabajando con lo último bajado */
  .sin-red{background:rgba(232,163,61,.14);border:1px solid rgba(232,163,61,.45);
    color:#F0BE6E;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
  .sin-red b{color:#FFD79A}

  /* ---------- servicios de atrás sin evidencia ---------- */
  .b-atras{display:block;width:100%;margin:14px 0 4px;padding:13px;font-size:13.5px;
    background:#17456E;color:var(--acc);border:1px solid var(--line)}
  .f-mes{margin:10px 0 12px}
  .f-mes select{width:100%}
  #atras .card{cursor:pointer}
  #atras .c-top{display:flex;align-items:center;gap:8px;font-size:14px}
  #atras .c-top b{font-weight:700}
  #atras .c-top .tag{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;
    border-radius:20px;background:#17456E;color:var(--acc)}
  #atras .c-sub{font-size:11.5px;color:var(--txt2);margin-top:3px}
  #atras .c-cta{font-size:12px;font-weight:700;color:var(--acc);margin-top:7px}
  .b-log{flex:1;justify-content:center;padding:13px 8px;font-size:13px;
    border:1.5px solid var(--line);background:#0F2C4A;color:var(--txt2)}
  .b-log.sel-ok{background:rgba(30,142,90,.25);border-color:var(--ok);color:#8FE6BB}
  .b-log.sel-mal{background:rgba(232,163,61,.22);border-color:var(--warn);color:#F0BE6E}
  .tres{display:flex;gap:8px;margin-bottom:12px}
  .tres input{margin-bottom:0}
  .tres input:nth-child(1){flex:2} .tres input:nth-child(2){flex:1}
  .tres input:nth-child(3){flex:1}
  .pista{font-size:11.5px;color:var(--txt3);margin:-4px 0 8px}
  .thumbs{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 12px}
  .th{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;
    border:1px solid var(--line);background:#0F2C4A}
  .th img{width:100%;height:100%;object-fit:cover}
  .th .pdf{display:flex;align-items:center;justify-content:center;height:100%;
    font-size:10px;font-weight:700;color:var(--acc);text-align:center;padding:4px}
  .th .x{position:absolute;top:2px;right:2px;background:rgba(5,16,28,.85);color:#fff;
    width:19px;height:19px;border-radius:50%;font-size:12px;line-height:19px;text-align:center;cursor:pointer}
  .aviso{background:rgba(198,65,59,.14);border:1px solid rgba(198,65,59,.4);color:#F0A9A5;
    border-radius:11px;padding:10px 12px;font-size:12px;margin-bottom:12px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
    background:#0F3A2A;color:#8FE6BB;border:1px solid #1E8E5A;padding:11px 18px;
    border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;
    max-width:88%;text-align:center}
  .toast.show{opacity:1}
  .toast.err{background:#3A1614;color:#F0A9A5;border-color:var(--bad)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="tri" viewBox="0 0 100 100"><path d="M50 8 L92 88 L8 88 Z" fill="none" stroke="#63B3FF" stroke-width="11" stroke-linejoin="round"/></svg>
      <div>
        <div class="bt">MD Control</div>
        <div class="bs">MI DÍA</div>
      </div>
      <div class="who" id="who" onclick="pedirTecnico()"></div>
    </div>
    <div class="days" id="days"></div>
  </header>

  <div class="cola" id="cola" style="display:none"></div>
  <div id="sinRed"></div>
  <div class="sum" id="sum"></div>
  <div id="lista"><div class="load">Cargando…</div></div>

  <!-- servicios de atrás que quedaron sin fotos -->
  <button class="b-atras" id="btnAtras" onclick="abrirAtras()" style="display:none">
    🗂️ Servicios pasados sin evidencia</button>
  <div id="atras" style="display:none"></div>
</div>

<!-- acceso -->
<div class="modal" id="mTec" style="display:none">
  <div class="box">
    <h2>Entrar</h2>
    <p class="sub">Busca tu nombre en la lista y escribe la clave que te dio el área técnica.</p>
    <select id="selUsr" onchange="document.getElementById('inPwd').focus()">
      <option value="">Cargando…</option>
    </select>
    <input id="inUsr" placeholder="o escribe tu usuario" autocapitalize="none"
           autocorrect="off" autocomplete="username" style="display:none">
    <input id="inPwd" type="password" placeholder="clave" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')entrar()">
    <div class="aviso" id="errLogin" style="display:none"></div>
    <button class="b-full" onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- cierre del servicio -->
<div class="modal" id="mCierre" style="display:none">
  <div class="box" id="boxCierre"></div>
</div>

<!-- visor con encuadre: lo que quede dentro del recuadro es la foto -->
<div class="cam" id="cam">
  <div class="cam-vis">
    <video id="camVideo" playsinline autoplay muted></video>
    <div class="cam-marco"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i>
      <div class="cam-guia" id="camGuia"></div></div>
    <div class="cam-tit" id="camTit"></div>
    <div class="cam-pista" id="camPista">Acerca hasta que llene el recuadro. Solo el equipo, derecho y centrado.</div>
  </div>
  <div class="cam-aviso" id="camAviso" style="display:none"></div>
  <div class="cam-barra">
    <button onclick="camCerrar()">Cancelar</button>
    <button class="cam-disparo" id="camBtn" onclick="camDisparar()"></button>
    <button onclick="camGirar()">Girar</button>
  </div>
</div>

<!-- para el inventario: la camara del sistema y la galeria, cuando el visor
     con recuadro no esta disponible -->
<input type="file" id="inPart" accept="image/*" capture="environment"
       style="display:none" onchange="agregarPartida(this)">
<input type="file" id="inPartGal" accept="image/*" multiple
       style="display:none" onchange="agregarPartida(this)">

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = "https://buwoxejgnmyvshwznbaj.supabase.co";
const SUPA_KEY = "sb_publishable_Pts8K36Tj4vZ7UzSAwwicw_K6I11-Aw";
const DOMINIO  = "mdcontrol.local";     // el correo es solo identificador interno
const BUCKET   = "evidencias";

/* la sesion del tecnico: todo lo que pida la app va firmado con su token, no
   con la llave publica, para que la base sepa quien es quien */
let ses = JSON.parse(localStorage.getItem("md_ses") || "null");
function HDRb(){
  return {apikey:SUPA_KEY, Authorization:"Bearer "+((ses&&ses.token)||SUPA_KEY)};
}
Object.defineProperty(window, "HDR", {get:HDRb});

const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const NOMBRE_TIPO = {ANTES:"Antes", DURANTE:"Durante", DESPUES:"Después",
  REPORTE:"Reporte", LEVANTAMIENTO:"Levantamiento", ATENCION:"Atención",
  AVANCE:"Avance", LOG:"Log"};
/* una semana atrás para poder regularizar servicios ya atendidos, y cuatro días
   adelante para ver lo que viene */
const DESDE = -7, HASTA = 4;

let tecnico   = localStorage.getItem("md_tecnico") || "";
let variantes = JSON.parse(localStorage.getItem("md_variantes") || "[]");
let fecha  = hoyISO();
let semana = [];
let datos  = [];

function hoyISO(){ return isoDe(new Date()) }
function isoDe(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(msg,err){const t=document.getElementById("toast");t.textContent=msg;
  t.className="toast show"+(err?" err":"");setTimeout(()=>t.className="toast"+(err?" err":""),3000)}
function hhmm(s){s=(s||"").trim();const m=s.match(/^(\d{1,2}):(\d{2})/);
  return m?m[1].padStart(2,"0")+":"+m[2]:(s||"--:--")}
function limpio(s){s=(s||"").trim();
  return /^(-+|n\/?a|na|s\/d|sin dato)$/i.test(s)?"":s}

async function api(path, opts, reintento){
  const o = opts||{};
  const h = Object.assign({}, HDRb(), o.body?{"Content-Type":"application/json",Prefer:"return=minimal"}:{});
  const r = await fetch(SUPA_URL+"/rest/v1/"+path, Object.assign({}, o, {headers:h}));
  const t = await r.text();
  if((r.status===401 || r.status===403) && !reintento && ses){
    if(await renovar()) return api(path, opts, true);   // el token dura una hora
  }
  if(!r.ok) throw new Error("HTTP "+r.status+" "+t.slice(0,120));
  return t ? JSON.parse(t) : null;   // POST/PATCH contestan 201/204 sin cuerpo
}

/* ============ acceso ============ */
async function auth(cuerpo, tipo){
  const r = await fetch(SUPA_URL+"/auth/v1/token?grant_type="+tipo,
    {method:"POST", headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},
     body:JSON.stringify(cuerpo)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg || j.error_description || ("HTTP "+r.status));
  return j;
}

function guardarSesion(j){
  const md=(j.user&&j.user.user_metadata)||{};
  ses = {token:j.access_token, refresh:j.refresh_token,
         nombre:md.nombre||"", rol:md.rol||"TECNICO",
         usuario:(j.user&&j.user.email||"").split("@")[0]};
  localStorage.setItem("md_ses", JSON.stringify(ses));
}

async function renovar(){
  if(!ses||!ses.refresh) return false;
  try{
    const j = await auth({refresh_token:ses.refresh}, "refresh_token");
    const nombre = ses.nombre;
    guardarSesion(j);
    if(!ses.nombre) ses.nombre = nombre;          // el refresh no siempre trae metadata
    localStorage.setItem("md_ses", JSON.stringify(ses));
    return true;
  }catch(e){ return false }
}

/* el desplegable se llena antes de entrar: es lo unico que la base deja leer
   sin sesion, y trae solo usuario y nombre */
async function llenarUsuarios(){
  const sel=document.getElementById("selUsr");
  try{
    const l=await api("login_usuarios?select=usuario,nombre&order=nombre");
    sel.innerHTML='<option value="">Elige tu nombre…</option>'+
      l.map(u=>`<option value="${esc(u.usuario)}">${esc(u.nombre||u.usuario)}</option>`).join("")+
      '<option value="__otro">Otro (escribir usuario)</option>';
    const ult=localStorage.getItem("md_ultimo");
    if(ult && l.some(u=>u.usuario===ult)) sel.value=ult;
  }catch(e){
    // sin internet no hay lista: que pueda teclear su usuario
    sel.style.display="none";
    document.getElementById("inUsr").style.display="";
  }
}

async function entrar(){
  const sel=document.getElementById("selUsr");
  const inp=document.getElementById("inUsr");
  if(sel.value==="__otro"){                 // alguien recien dado de alta
    sel.style.display="none"; inp.style.display=""; inp.focus(); return;
  }
  const u=((sel.value || inp.value)||"").trim().toLowerCase();
  const p=document.getElementById("inPwd").value||"";
  const err=document.getElementById("errLogin");
  if(!u||!p){ err.style.display="block"; err.textContent="Elige tu nombre y escribe tu clave."; return }
  err.style.display="none";
  try{
    const correo = u.indexOf("@")>0 ? u : u+"@"+DOMINIO;
    guardarSesion(await auth({email:correo, password:p}, "password"));
    tecnico = ses.nombre || u;
    localStorage.setItem("md_ultimo", u);   // queda preseleccionado la proxima vez
    document.getElementById("inPwd").value="";
    document.getElementById("mTec").style.display="none";
    // quien arma los entregables no trabaja el dia a dia: va a su propia pantalla
    if(ses.rol==="ADMINISTRATIVO"){ location.href="entregables.html"; return }
    await arrancarSesion();
  }catch(e){
    err.style.display="block";
    err.textContent = /invalid/i.test(String(e))
      ? "Usuario o clave incorrectos." : "No se pudo entrar: "+String(e).slice(0,80);
  }
}

function pedirTecnico(){                  // ahora es cerrar sesion / cambiar de usuario
  if(ses && !confirm("¿Salir de la cuenta de "+(ses.nombre||ses.usuario)+"?")) return;
  ses=null; tecnico=""; variantes=[]; semana=[]; datos=[];
  localStorage.removeItem("md_ses");
  localStorage.removeItem("md_tecnico");
  localStorage.removeItem("md_variantes");
  document.getElementById("mTec").style.display="flex";
  llenarUsuarios();
}

/* ============ como se llama cada quien en la base ============
   La base guarda el nombre del tecnico escrito de muchas formas ("Marcos
   flores", "MANUEL/ALEX", "Cristian" por "Christian"). La correspondencia con
   la persona real esta resuelta en la tabla tecnico_alias, que se revisa a mano
   desde el area: aqui solo se consulta la del tecnico que entro. */
async function cargarVariantes(){
  const a = await api("tecnico_alias?select=variante&persona=eq."+encodeURIComponent(tecnico));
  variantes = [...new Set([tecnico].concat(a.map(r=>r.variante)))];
  localStorage.setItem("md_tecnico", tecnico);
  localStorage.setItem("md_variantes", JSON.stringify(variantes));
}

/* ============ dias ============ */
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

function pintarDias(){
  document.getElementById("who").innerHTML="Salir<b>"+esc(tecnico)+"</b>";
  const cont=document.getElementById("days"); cont.innerHTML="";
  let activo=null, mesPrevio=null;
  for(let i=DESDE;i<=HASTA;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const iso=isoDe(d);
    const delDia=semana.filter(x=>x.fecha_servicio===iso);
    const pend=delDia.filter(x=>(x.status||"").toUpperCase()!=="ATENDIDO").length;
    const el=document.createElement("div");
    // los días pasados sin nada que hacer se atenúan, para que no estorben
    el.className="day"+(iso===fecha?" on":"")+((i<0&&!pend)?" ido":"");
    // el mes solo cuando cambia, para no perderse al cruzar de mes
    const cabeza = i===0 ? "HOY"
                 : (d.getMonth()!==mesPrevio && mesPrevio!==null
                    ? DIAS[d.getDay()]+" "+MESES[d.getMonth()] : DIAS[d.getDay()]);
    mesPrevio=d.getMonth();
    el.innerHTML=`<div class="d">${cabeza}</div>`+
                 `<div class="n">${d.getDate()}</div>`+
                 (pend?`<div class="dot"></div>`:"");
    el.onclick=()=>{fecha=iso;pintarDias();pintar()};
    cont.appendChild(el);
    if(iso===fecha) activo=el;
  }
  // con doce días la barra no cabe en el celular: se centra el día elegido
  if(activo) activo.scrollIntoView({block:"nearest", inline:"center"});
}

/* ============ servicios ============ */
/* El técnico entra a sótanos, bodegas y azoteas donde no hay señal. Sus
   servicios se guardan en el teléfono cada vez que sí alcanza a bajarlos, para
   que pueda verlos y cerrarlos aunque llegue sin internet. */
function guardarSemanaLocal(){
  try{
    localStorage.setItem("md_semana", JSON.stringify(
      {ts:new Date().toISOString(), tecnico:tecnico, filas:semana}));
  }catch(e){}          // si no cabe, se sigue sin guardar: no vale tirar la app
}
function leerSemanaLocal(){
  try{
    const d=JSON.parse(localStorage.getItem("md_semana")||"null");
    return (d && d.filas && d.tecnico===tecnico) ? d : null;
  }catch(e){ return null }
}
function avisoSinSenal(cuando){
  const d=new Date(cuando);
  const f=d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"});
  const h=d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}).replace(/\s*\./g,"");
  return `<div class="sin-red">📡 Sin internet · esto es lo que bajaste el ${f} a las ${h}.
    <b>Puedes cerrar tus servicios igual</b>: se guardan en el teléfono y suben solos
    cuando vuelva la señal.</div>`;
}

async function cargar(){
  document.getElementById("lista").innerHTML='<div class="load">Cargando…</div>';
  const a=new Date(); a.setDate(a.getDate()+DESDE);
  const b=new Date(); b.setDate(b.getDate()+HASTA);
  /* No se filtra por técnico: la base ya devuelve solo lo suyo — sus servicios
     y aquellos donde lo asignaron como brigada o auxiliar de apoyo. */
  try{
    semana=await api("servicios?select=id,coord,tkt,nombre,dependencia,direccion,lat,long,"+
      "fecha_servicio,horario_atencion,status,personal_atiende,telefono,obs_prog,obs_coord,"+
      "requerimientos,tipo_servicio,obra,dias_est,dia_n,"+
      "log_estado,log_saltos,log_ultimo,canal,senal_barras"+
      "&fecha_servicio=gte."+isoDe(a)+"&fecha_servicio=lte."+isoDe(b)+
      "&order=fecha_servicio,horario_atencion&limit=500");
    guardarSemanaLocal();
    document.getElementById("sinRed").innerHTML="";
    // estos dos son adorno: si fallan, la lista se ve igual
    try{ await marcarEquipo() }catch(e){}
    try{ await marcarEvidencias() }catch(e){}
    pintarDias(); pintar();
  }catch(e){
    const g=leerSemanaLocal();
    if(g){
      semana=g.filas;
      document.getElementById("sinRed").innerHTML=avisoSinSenal(g.ts);
      pintarDias(); pintar();
    }else{
      document.getElementById("sinRed").innerHTML="";
      document.getElementById("lista").innerHTML=
        '<div class="vacio"><div class="em">📡</div>No se pudo conectar y todavía no'+
        ' hay nada guardado en este teléfono.<br>Conéctate una vez y ya podrás'+
        ' trabajar sin señal.<br><br>'+
        '<button class="b-map" onclick="cargar()">Reintentar</button></div>';
    }
  }
}

/* un servicio se identifica por coordinacion + id: el mismo id existe en varias
   coordinaciones (571 casos), asi que usarlo solo cruzaria los registros */
function llave(s){ return s.coord+"|"+s.id }

/* servicios que llevan más de una cuadrilla o auxiliares de apoyo */
async function marcarEquipo(){
  const ids=[...new Set(semana.map(s=>s.id))]; if(!ids.length) return;
  try{
    const eq=await api("servicio_personal?select=coord,servicio_id,persona,rol,brigada"+
                       "&servicio_id=in.("+ids.join(",")+")&order=brigada,rol");
    const por={};
    eq.forEach(p=>{ const k=p.coord+"|"+p.servicio_id; (por[k]=por[k]||[]).push(p) });
    semana.forEach(s=>{ s._eq=por[llave(s)]||[] });
  }catch(e){ semana.forEach(s=>{ s._eq=s._eq||[] }) }
}

async function marcarEvidencias(){
  const ids=[...new Set(semana.map(s=>s.id))]; if(!ids.length) return;
  try{
    const ev=await api("evidencias?select=coord,servicio_id,tipo&servicio_id=in.("+ids.join(",")+")");
    const por={};
    ev.forEach(e=>{ const k=e.coord+"|"+e.servicio_id; (por[k]=por[k]||{})[e.tipo]=true });
    semana.forEach(s=>{ s._ev=por[llave(s)]||{} });
  }catch(e){ semana.forEach(s=>{ s._ev=s._ev||{} }) }
}

function claseEstatus(s){
  s=(s||"").toUpperCase();
  if(s==="ATENDIDO") return "ok";
  if(s.indexOf("REPROG")>=0) return "re";
  return "pe";
}
function notas(x){
  const n=[x.requerimientos,x.obs_prog,x.obs_coord].map(v=>limpio(v))
    .filter(v=>v && !/carga historica|sync control|alta walmart|falta de actualizacion/i.test(v));
  return [...new Set(n)].join(" · ");
}

        <span class="st ${cl}">${esc(x.status||"PENDIENTE")}</span>
      </div>

      ${esObra(x)?`<div class="obra">Obra de ${x.dias_est} días · hoy es el día ${x.dia_n}${
         cerrado?"":" · <b>en proceso, aún no se factura</b>"}</div>`:""}
      ${(dep||tip)?`<div class="dep">${esc(dep)}${dep&&tip?" · ":""}${esc(tip)}</div>`:""}
      ${dir?`<div class="dir"><svg width="13" height="13" viewBox="0 0 24 24" fill="#6E8CAD"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></svg><span>${esc(dir)}</span></div>`:""}
      ${(pers||tel)?`<div class="cont">👤 ${esc(pers)}${pers&&tel?" · ":""}${esc(tel)}</div>`:""}
      ${x.log_estado?`<div class="logev ${x.log_estado==="SALTEADO"?"mal":"bien"}">${

      ${(x._eq&&x._eq.length)?`<div class="equipo">🔧 ${

  DESPUES: "La misma pieza ya terminada y funcionando. Solo las que trabajaste."};

/* El receptor registra un tono de supervisión cada 3 horas. El técnico lo lee
   en la pantalla del equipo: si falta alguno, ese rato el equipo no estuvo
   recibiendo. Se pregunta en los mantenimientos, que es donde se revisa. */
const PIDE_LOG = ["MANT", "PRY_ESP"];
function pideLog(coord, modo){
  return PIDE_LOG.indexOf((coord||"").toUpperCase())>=0 &&
         (modo==="ATENDIDO" || modo==="FIN_OBRA");
}

function esObra(s){ return !!(s && s.obra && (s.dias_est||0) > 1) }

/* qué se le pide según la coordinación y, si es obra, según cómo cierre el día */
function bloquesDe(coord, modo){
  if(modo==="CONTINUIDAD") return BLOQUES_AVANCE;
  if(modo==="FIN_OBRA")    return BLOQUES_FIN;
  // al regularizar se ofrecen las mismas etapas, pero nada es obligatorio:
  // de un servicio de hace meses el técnico sube lo que haya conservado
  return POR_COORD[(coord||"").toUpperCase()] || BLOQUES;
}

let cie = null;   // {srv, estatus, _bloques, y un arreglo por bloque}

function abrirCierre(coord, id, modo){
  const srv=semana.find(s=>s.coord===coord && s.id===id); if(!srv) return;
  cie={srv:srv, estatus:modo, _bloques:bloquesDe(coord, modo).slice()};
  if(pideLog(coord, modo)){
    cie._bloques.push({campo:"logfoto", tipo:"LOG",
      titulo:(cie._bloques.length+1)+" · Foto del log de eventos",
      pista:"La pantalla del equipo con el registro"});
    cie.log = {estado: srv.log_estado||"", saltos: srv.log_saltos||"",
               ultimo: srv.log_ultimo||"", canal: srv.canal||"",
               barras: srv.senal_barras||""};
  }
  cie._bloques.forEach(b=>{ cie[b.campo]=[] });
  /* el inventario se lleva pieza por pieza en las tres etapas, solo donde se
     interviene el equipo. El conteo de aditamentos sale del "Antes", que es lo
     que hay instalado; en las otras dos son la prueba del trabajo. */
  cie.partidas = null;
  if(PART_COORD.indexOf((coord||"").toUpperCase())>=0){
    const etapas = cie._bloques.filter(b=>ETAPAS_PART.indexOf(b.tipo)>=0);
    if(etapas.length){
      cie.partidas = {};
      etapas.forEach(b=>{
        cie.partidas[b.tipo] = {};
        PARTIDAS.forEach(p=>{ cie.partidas[b.tipo][p.id]=[] });
      });
      cie.series = {EQUIPO: srv.serie||"", AMPLIFICADOR:""};
    }
  }
  document.getElementById("mCierre").style.display="flex";
  pintarCierre();
}

/* ============ servicios de atrás sin evidencia ============
   Quedaron miles de servicios cerrados antes de que existiera la app, sin una
   sola foto. Aquí el técnico los ve y les sube lo que tenga en el celular: no
   se vuelve a cerrar nada —ya están atendidos—, solo se les agrega la evidencia
   que falta. */
let atras = {abierto:false, filas:[], mes:""};

async function abrirAtras(){
  atras.abierto = !atras.abierto;
  const cont = document.getElementById("atras");
  document.getElementById("lista").style.display = atras.abierto ? "none" : "";
  document.getElementById("sum").style.display   = atras.abierto ? "none" : "";
  cont.style.display = atras.abierto ? "block" : "none";
  document.getElementById("btnAtras").textContent = atras.abierto
    ? "◀ Volver a mi día" : "🗂️ Servicios pasados sin evidencia";
  if(!atras.abierto) return;
  cont.innerHTML = '<div class="load">Buscando lo que quedó sin fotos…</div>';
  try{
    // lo mío ya viene filtrado por la base; solo lo cerrado y de fecha vieja
    const tope = isoDe(new Date(Date.now() - 8*86400000));
    const srv = await api("servicios?select=id,coord,tkt,nombre,dependencia,direccion,"+
      "fecha_servicio,fecha_atencion,tecnico,serie,status"+
      "&status=eq.ATENDIDO&fecha_servicio=lt."+tope+
      "&order=fecha_servicio.desc&limit=600");
    const evs = await api("evidencias?select=coord,servicio_id&limit=5000");
    const con = new Set(evs.map(e=>e.coord+"|"+e.servicio_id));
    atras.filas = srv.filter(s=>!con.has(s.coord+"|"+s.id));
    pintarAtras();
  }catch(e){
    cont.innerHTML = '<div class="vacio">No se pudo consultar: '+esc(e.message)+'</div>';
  }
}

function pintarAtras(){
  const cont = document.getElementById("atras");
  const meses = [...new Set(atras.filas.map(s=>(s.fecha_servicio||"").slice(0,7)))].sort().reverse();
  const sel = atras.mes || "";
  const vis = atras.filas.filter(s=>!sel || (s.fecha_servicio||"").startsWith(sel));
  if(!atras.filas.length){
    cont.innerHTML = '<div class="vacio">Al corriente: no tienes servicios pasados sin evidencia.</div>';
    return;
  }
  cont.innerHTML = `
    <div class="sum">${atras.filas.length} servicio(s) tuyos cerrados sin una sola foto.
      Sube lo que tengas guardado en el celular.</div>
    <div class="f-mes">
      <select onchange="atras.mes=this.value;pintarAtras()">
        <option value="">Todos los meses</option>
        ${meses.map(m=>`<option value="${m}" ${m===sel?"selected":""}>${mesLargo(m)}</option>`).join("")}
      </select>
    </div>
    ${vis.slice(0,120).map(s=>`
      <div class="card" onclick="regularizar('${s.coord}',${s.id})">
        <div class="c-top"><b>${esc(s.nombre||"(sin nombre)")}</b>
          <span class="tag">${esc(s.coord)}</span></div>
        <div class="c-sub">${esc(s.fecha_servicio||"")} · ${esc(limpio(s.dependencia)||"")}
          ${s.tkt?" · TKT "+esc(s.tkt):""}</div>
        <div class="c-cta">Agregar evidencia →</div>
      </div>`).join("")}
    ${vis.length>120?`<div class="vacio">…y ${vis.length-120} más. Filtra por mes para verlos.</div>`:""}`;
}

function mesLargo(m){
  const N=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];
  const p=(m||"").split("-");
  return p.length===2 ? N[parseInt(p[1],10)-1]+" "+p[0] : m;
}

/* abre la misma hoja de evidencia, pero sin volver a cerrar el servicio */
function regularizar(coord, id){
  const s = atras.filas.find(x=>x.coord===coord && x.id===id);
  if(!s) return;
  if(!semana.some(x=>x.coord===coord && x.id===id)) semana.push(s);
  s._ev = s._ev || {};
  abrirCierre(coord, id, "REGULARIZAR");
}

/* ---------- inventario: una foto por pieza, en cada etapa ----------
   La misma lista de piezas se lleva en el antes, el durante y el despues; lo
   que cambia es para que sirve cada una. El conteo de aditamentos sale solo del
   antes, que es lo que hay instalado: contarlo tres veces lo triplicaria. */
function partLista(etapa, pid){ return cie.partidas[etapa][pid] }

function partAgregar(etapa, pid){
  const p = PARTIDAS.find(x=>x.id===pid);
  let variante = "";
  if(p.tipos){
    const sel = document.getElementById("tipo_"+etapa+"_"+pid);
    variante = sel ? sel.value : p.tipos[0][0];
  }
  const n = partLista(etapa, pid).length + 1;
  const tit = (p.varias ? `${p.tit.replace(/s$/,"")} ${n}${variante?" · "+variante:""}` : p.tit)
            + "  ·  " + NOMBRE_ETAPA[etapa];
  camPendiente = {etapa:etapa, pid:pid, variante:variante};
  if(camSoportada()) camAbrir("__part__", tit, p.pista, p.guia);
  else camNativo("__part__");
}
/* de la galería, para los servicios pasados y para cuando la cámara no abre */
function partGaleria(etapa, pid){
  const p = PARTIDAS.find(x=>x.id===pid);
  const sel = document.getElementById("tipo_"+etapa+"_"+pid);
  const inp = document.getElementById("inPartGal");
  inp.dataset.etapa = etapa;
  inp.dataset.pid = pid;
  inp.dataset.variante = (p.tipos && sel) ? sel.value : "";
  inp.click();
}
function partQuitar(etapa, pid, i){
  partLista(etapa, pid).splice(i,1);
  pintarCierre();
}
function partSerie(pid, v){ cie.series[pid] = v }

/* cuenta cuantas piezas de cada tipo se fotografiaron, para escribirlas en el
   servicio: es el dato que hoy se teclea en la oficina */
function conteoPartidas(){
  const out = {};
  if(!cie.partidas || !cie.partidas.ANTES) return out;
  for(const p of PARTIDAS){
    const lista = cie.partidas.ANTES[p.id];
    if(!lista.length) continue;
    if(p.tipos){
      for(const [nombre,campo] of p.tipos){
        const n = lista.filter(f=>f.variante===nombre).length;
        if(n) out[campo] = String(n);
      }
    }else if(p.cuenta){
      out[p.cuenta] = String(lista.length);
    }
  }
  if(cie.series && (cie.series.EQUIPO||"").trim()) out.serie = cie.series.EQUIPO.trim();
  return out;
}

/* el técnico marca lo que vio en la pantalla del receptor */
function logEstado(v){
  cie.log.estado=v;
  cie.log.saltos = (v==="SALTEADO") ? cie.log.saltos : "";
  pintarCierre();
}
function logCampo(k, v){ cie.log[k]=v }

/* textos de la hoja según cómo se está cerrando el día */
const MODOS = {
  ATENDIDO:     {tit:"Cerrar servicio",           btn:"Cerrar servicio"},
  REPROGRAMADO: {tit:"Reprogramar servicio",      btn:"Reprogramar"},
  CONTINUIDAD:  {tit:"La obra sigue en proceso",  btn:"Guardar avance del día"},
  FIN_OBRA:     {tit:"Instalación concluida",     btn:"Dar por concluida"},
  /* el servicio ya está atendido: aquí solo se le agrega la evidencia que no
     se tomó en su momento, sin volver a tocar su estatus ni su fecha */
  REGULARIZAR:  {tit:"Agregar evidencia",         btn:"Guardar evidencia"}
};

/* ¿ese bloque ya está cubierto, sea con lo ya subido o con lo que trae ahora? */
function cubierto(b){
  const ya = (cie.srv._ev && cie.srv._ev[b.tipo]) ? 1 : 0;
  // en el "Antes" la foto del equipo del inventario ya cuenta como evidencia
  const inv = (cie.partidas && cie.partidas[b.tipo])
            ? PARTIDAS.reduce((n,p)=>n+cie.partidas[b.tipo][p.id].length, 0) : 0;
  return ya + cie[b.campo].length + inv > 0;
}
function cerrarHoja(){
  document.getElementById("mCierre").style.display="none"; cie=null;
}

function pintarCierre(){
  const s=cie.srv, esRep=cie.estatus==="REPROGRAMADO";
  const m=MODOS[cie.estatus]||MODOS.ATENDIDO;
  const esReg = cie.estatus==="REGULARIZAR";
  const faltan = (esRep||esReg) ? [] : cie._bloques.filter(b=>!cubierto(b));
  const listo = faltan.length===0;
  const quedan = esObra(s) ? (s.dias_est - s.dia_n) : 0;

  /* el inventario: un renglón por pieza, con su "+" para las que se repiten */
  const partida = (etapa, p) => {
    const lista = cie.partidas[etapa][p.id], hay = lista.length;
    const req = p.req && etapa==="ANTES";          // el equipo solo se exige al llegar
    const fotos = lista.map((f,i)=>`
      <div class="pz">
        <img src="${f.url}">
        <span>${f.variante || (p.varias ? "#"+(i+1) : "")}</span>
        <button onclick="partQuitar('${etapa}','${p.id}',${i})">✕</button>
      </div>`).join("");
    const selTipo = p.tipos ? `
      <select id="tipo_${etapa}_${p.id}" class="pz-tipo">
        ${p.tipos.map(([n])=>`<option>${n}</option>`).join("")}</select>` : "";
    return `
      <div class="part ${hay?"lista":""}">
        <div class="part-cab">
          <b>${p.tit}</b>
          ${req?'<span class="req'+(hay?" listo":"")+'">'+(hay?"listo":"obligatorio")+'</span>'
               :(hay?`<span class="cta">${hay}</span>`:"")}
        </div>
        ${hay?`<div class="pzs">${fotos}</div>`:""}
        <div class="part-acc">
          ${selTipo}
          <button class="b-part" onclick="partAgregar('${etapa}','${p.id}')">
            ${hay&&p.varias?"+ Agregar otra":(hay?"Repetir foto":"📷 Tomar foto")}</button>
        </div>
        <button class="liga-gal" onclick="partGaleria('${etapa}','${p.id}')">o subir de la galería</button>
        ${(p.serie && etapa==="ANTES")?`<input class="pz-serie" placeholder="Número de serie"
           value="${(cie.series[p.id]||"").replace(/"/g,"&quot;")}"
           oninput="partSerie('${p.id}',this.value)">`:""}
      </div>`;
  };

  const seccionPartidas = etapa => (!cie.partidas || !cie.partidas[etapa]) ? "" : `
    <div class="lbl">${TIT_PART[etapa]}
      ${etapa==="ANTES"?`<span class="req ${cie.partidas.ANTES.EQUIPO.length?"listo":""}">${cie.partidas.ANTES.EQUIPO.length?"listo":"obligatorio"}</span>`:""}</div>
    <p class="pista">${PISTA_PART[etapa]}</p>
    ${PARTIDAS.map(p=>partida(etapa,p)).join("")}`;

  const bloque = b => {
    const ok=cubierto(b), ya=s._ev&&s._ev[b.tipo];
    return `
      <div class="lbl">${b.titulo}
        <span class="req ${ok?"listo":""}">${ok?"listo":"obligatorio"}</span></div>
      <p class="pista">${b.pista}</p>
      ${seccionPartidas(b.tipo)}
      <button class="b-cam solo" onclick="abrirFoto('${b.campo}','${b.titulo.replace(/'/g,"")}','${(b.pista||"").replace(/'/g,"")}')">📷 Tomar foto</button>
      <button class="liga-gal" onclick="document.getElementById('in_${b.campo}_gal').click()">${b.pdf?"o subir de la galería / un PDF":"o subir de la galería"}</button>
      ${ya?'<div class="ya">Ya tiene archivos cargados de esta etapa.</div>':""}
      <!-- sin "multiple": con el, el celular ignora la orden de abrir la camara
           y saca el menu de siempre. Una foto por toma, y se repite el boton. -->
      <input type="file" id="in_${b.campo}_cam" accept="image/*" capture="environment"
             style="display:none" onchange="agregar(this,'${b.campo}')">
      <input type="file" id="in_${b.campo}_gal" accept="${b.pdf?"image/*,application/pdf":"image/*"}" multiple
             style="display:none" onchange="agregar(this,'${b.campo}')">
      <div class="thumbs">${thumbs(b.campo)}</div>`;
  };

  const pideMotivo = esRep;

  function seccionLog(){
    const L=cie.log, ok=!!L.estado;
    return `
      <div class="lbl">Log de eventos
        <span class="req ${ok?"listo":""}">${ok?"listo":"obligatorio"}</span></div>
      <p class="pista">El equipo registra un tono cada 3 horas. Revisa en su pantalla
         si están todos o si falta alguno.</p>
      <div class="dos">
        <button class="b-log ${L.estado==="CONTINUO"?"sel-ok":""}"
                onclick="logEstado('CONTINUO')">✓ Continuo</button>
        <button class="b-log ${L.estado==="SALTEADO"?"sel-mal":""}"
                onclick="logEstado('SALTEADO')">⚠ Con saltos</button>
      </div>
      ${L.estado==="SALTEADO"?`
        <input id="logSaltos" placeholder="¿Cuáles faltan? ej. 12-jul 04:39 y 07:39"
               value="${esc(L.saltos)}" oninput="logCampo('saltos',this.value)">`:""}
      <div class="tres">
        <input id="logUlt" placeholder="Último registro (dd-mm hh:mm)"
               value="${esc(L.ultimo)}" oninput="logCampo('ultimo',this.value)">
        <input id="logCanal" placeholder="Canal" value="${esc(L.canal)}"
               oninput="logCampo('canal',this.value)">
        <input id="logBarras" type="number" min="0" max="5" placeholder="Barras"
               value="${esc(L.barras)}" oninput="logCampo('barras',this.value)">
      </div>`;
  }
  document.getElementById("boxCierre").innerHTML=`
    <h2>${m.tit}</h2>
    <p class="sub">${esc(hhmm(s.horario_atencion))} · ${esc(s.nombre)}${s.tkt?" · TKT "+esc(s.tkt):""}${
       esObra(s)?" · día "+s.dia_n+" de "+s.dias_est:""}</p>

    ${cie.estatus==="CONTINUIDAD"?`<div class="ojo">El día queda como <b>recurso en uso</b>:
       la brigada trabajó, pero la instalación <b>no está concluida</b> y todavía no
       se factura.</div>`:""}
    ${cie.estatus==="FIN_OBRA"?`<div class="ojo"><b>Solo si la instalación quedó
       terminada y funcionando.</b> Al darla por concluida se marca como atendida, y
       de ahí ventas la toma para cobrarla.${quedan>0?" Los "+quedan+
       " día(s) que quedaban programados se cancelan.":""}</div>`:""}

    ${esRep?"":`
      ${listo?"":`<div class="aviso">Falta la evidencia de:
         <b>${faltan.map(b=>b.titulo.replace(/^\d+ · /,"")).join(", ")}</b>.</div>`}
      ${cie.log?seccionLog():""}
      ${cie._bloques.map(bloque).join("")}
    `}

    <div class="lbl">${esRep?"":(cie._bloques.length+1)+" · "}Comentarios ${
       pideMotivo?'<span class="req">obligatorio</span>':""}</div>
    <textarea id="txtCom" placeholder="${
        esRep ? "¿Por qué se reprograma? (sitio cerrado, falta acceso, cliente canceló…)"
      : cie.estatus==="CONTINUIDAD" ? "Hasta dónde se llegó y qué queda pendiente…"
      : "Qué se hizo, baterías cambiadas, equipo que se lleva a laboratorio, pendientes…"}">${esc(cie.com||"")}</textarea>

    <button class="b-full" id="btnGo" ${listo?"":"disabled"} onclick="confirmarCierre()">${m.btn}</button>
    <button class="b-gris" onclick="cerrarHoja()">Cancelar</button>`;

  const t=document.getElementById("txtCom");
  if(t) t.oninput=()=>{ cie.com=t.value };
}

function thumbs(campo){
  return cie[campo].map((f,i)=>`<div class="th">
    ${f.tipoMime==="application/pdf"
      ? `<div class="pdf">PDF<br>${esc((f.nombre||"").slice(0,10))}</div>`
      : `<img src="${f.url}">`}
    <div class="x" onclick="quitar('${campo}',${i})">×</div></div>`).join("");
}
function quitar(campo,i){ cie[campo].splice(i,1); pintarCierre() }

/* ============ camara con encuadre ============
   Todas las fotos salen de 1200x900: se recorta lo que quedo dentro del
   recuadro amarillo. Asi el informe deja de verse disparejo y basta una foto
   por partida en vez de varias "por si acaso". */
const FOTO_W = 1200, FOTO_H = 900;      // 4:3, el mismo que el recuadro
let camStream = null, camDestino = null, camFrontal = false, camPendiente = null;
let camPorQue = "";     // por que no abrio, para poder decirlo
let camGuiaAct = null;  // cuanto debe ocupar la pieza en el encuadre actual

function camSoportada(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
            window.isSecureContext);
}

async function camAbrir(campo, titulo, pista, guia){
  camDestino = {campo:campo};
  document.getElementById("camTit").textContent = titulo || "";
  if(pista) document.getElementById("camPista").textContent = pista;
  camGuiaAct = guia || null;
  const g = document.getElementById("camGuia");
  if(guia){ g.style.display="block"; g.style.width=guia+"%"; g.style.aspectRatio="4/3" }
  else g.style.display="none";
  document.getElementById("cam").classList.add("on");
  document.getElementById("camAviso").style.display = "none";
  /* Se pide de lo mas exigente a lo mas simple. Varios Android rechazan de un
     golpe la peticion completa (resolucion + camara trasera) en vez de darte lo
     que puedan, y entonces no abre nada. */
  const intentos = [
    {video:{facingMode: camFrontal?"user":{ideal:"environment"},
            width:{ideal:1920}, height:{ideal:1440}}, audio:false},
    {video:{facingMode: camFrontal?"user":"environment"}, audio:false},
    {video:true, audio:false}
  ];
  for(const req of intentos){
    try{
      camStream = await navigator.mediaDevices.getUserMedia(req);
      const v = document.getElementById("camVideo");
      v.srcObject = camStream;
      await v.play();
      return true;
    }catch(e){ camPorQue = e && (e.name||e.message) }
  }
  // no se pudo: se sigue por el camino de siempre, que recorta igual
  camCerrar();
  camNativo(campo);
  return false;
}

/* la camara del sistema, cuando la de la app no esta disponible */
function camNativo(campo){
  if(campo==="__part__" && camPendiente){
    const inp = document.getElementById("inPart");
    inp.dataset.etapa = camPendiente.etapa || "ANTES";
    inp.dataset.pid = camPendiente.pid;
    inp.dataset.variante = camPendiente.variante||"";
    inp.click();
  }else{
    const inp = document.getElementById("in_"+campo+"_cam");
    if(inp) inp.click();
  }
}

function camGirar(){
  camFrontal = !camFrontal;
  const d = camDestino;
  camCerrar();
  if(d) camAbrir(d.campo, document.getElementById("camTit").textContent, null, camGuiaAct);
}

function camCerrar(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null }
  document.getElementById("cam").classList.remove("on");
  document.getElementById("camVideo").srcObject = null;
}

/* El video se muestra recortado a la pantalla (object-fit:cover), asi que hay
   que traducir el recuadro de la pantalla a coordenadas del video real. */
function camRecorte(){
  const v = document.getElementById("camVideo");
  const vis = document.querySelector(".cam-vis").getBoundingClientRect();
  const mar = document.querySelector(".cam-marco").getBoundingClientRect();
  const esc = Math.max(vis.width / v.videoWidth, vis.height / v.videoHeight);
  const offX = (vis.width  - v.videoWidth  * esc) / 2;
  const offY = (vis.height - v.videoHeight * esc) / 2;
  return {sx:(mar.left - vis.left - offX)/esc, sy:(mar.top - vis.top - offY)/esc,
          sw:mar.width/esc, sh:mar.height/esc};
}

async function camDisparar(){
  const v = document.getElementById("camVideo");
  if(!v.videoWidth) return;
  const r = camRecorte();
  const c = document.createElement("canvas");
  c.width = FOTO_W; c.height = FOTO_H;
  c.getContext("2d").drawImage(v, r.sx, r.sy, r.sw, r.sh, 0, 0, FOTO_W, FOTO_H);
  const blob = await new Promise(res=>c.toBlob(res, "image/jpeg", 0.72));
  const campo = camDestino.campo, pend = camPendiente;
  camCerrar(); camPendiente = null;
  const foto = {blob:blob, url:URL.createObjectURL(blob),
                tipoMime:"image/jpeg", nombre:"foto.jpg"};
  if(campo==="__part__" && pend){
    foto.variante = pend.variante;
    cie.partidas[pend.etapa][pend.pid].push(foto);
  }else{
    cie[campo].push(foto);
  }
  pintarCierre();
}

/* un solo camino para las fotos: el visor con recuadro y, si el telefono no lo
   permite, la camara de siempre (que se recorta igual al guardarse) */
function abrirFoto(campo, titulo, pista){
  if(camSoportada()){ camPendiente = null; camAbrir(campo, titulo, pista) }
  else document.getElementById("in_"+campo+"_cam").click();
}

/* respaldo cuando el telefono no deja abrir la camara dentro de la app */
async function agregarPartida(input){
  const etapa = input.dataset.etapa || (camPendiente && camPendiente.etapa) || "ANTES";
  const pid = input.dataset.pid, variante = input.dataset.variante||"";
  const files = [...input.files]; input.value = "";
  for(const f of files){
    try{
      const blob = await recortarCentro(f);
      cie.partidas[etapa][pid].push({blob:blob, url:URL.createObjectURL(blob),
        tipoMime:blob.type||"image/jpeg", nombre:f.name, variante:variante});
    }catch(e){ toast("No se pudo leer una imagen", true) }
  }
  pintarCierre();
}

/* Las que llegan de la galeria se recortan al centro con la misma proporcion,
   para que no desentonen con las tomadas con el recuadro. */
async function recortarCentro(file){
  if(file.type==="application/pdf") return file;
  const img = await createImageBitmap(file);
  const objetivo = FOTO_W / FOTO_H;
  let sw = img.width, sh = Math.round(img.width / objetivo);
  if(sh > img.height){ sh = img.height; sw = Math.round(img.height * objetivo) }
  const c = document.createElement("canvas");
  c.width = FOTO_W; c.height = FOTO_H;
  c.getContext("2d").drawImage(img, Math.round((img.width-sw)/2),
    Math.round((img.height-sh)/2), sw, sh, 0, 0, FOTO_W, FOTO_H);
  return await new Promise(r=>c.toBlob(r, "image/jpeg", 0.72));
}

async function agregar(input, campo){
  const files=[...input.files]; input.value="";
  for(const f of files){
    try{
      const blob=await recortarCentro(f);
      cie[campo].push({blob:blob, url:URL.createObjectURL(blob),
                       tipoMime:blob.type, nombre:f.name});
    }catch(e){ toast("No se pudo leer una imagen",true) }
  }
  pintarCierre();
}

/* las fotos del celular pesan 3-6 MB; se reducen antes de subir porque en campo
   la señal es mala y el bucket tiene tope de 8 MB por archivo */
async function comprimir(file){
  if(file.type==="application/pdf") return file;
  const img=await createImageBitmap(file);
  const k=Math.min(1, 1400/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.62));
}

function confirmarCierre(){
  const com=(document.getElementById("txtCom").value||"").trim();
  if(cie.estatus==="REPROGRAMADO" && !com){
    toast("Escribe por qué se reprograma",true); return;
  }
  const s=cie.srv;
  if(cie.log && !cie.log.estado){
    toast("Marca si el log de eventos está continuo o con saltos",true); return;
  }
  if(cie.log && cie.log.estado==="SALTEADO" && !(cie.log.saltos||"").trim()){
    toast("Anota qué tonos faltan en el log",true); return;
  }
  if(cie.estatus!=="REPROGRAMADO"){
    const faltan=cie._bloques.filter(b=>!cubierto(b));
    if(faltan.length){
      toast("Falta: "+faltan.map(b=>b.titulo.replace(/^\d+ · /,"")).join(", "),true);
      return;
    }
  }
  const btn=document.getElementById("btnGo");
  btn.disabled=true; btn.textContent="Guardando…";
  guardarCierre(s, cie.estatus, com);
}

/* ============ guardar (con cola sin señal) ============ */
async function subirArchivo(item, blob, tipo, i){
  const ext = blob.type==="application/pdf" ? "pdf" : "jpg";
  // el tipo puede venir compuesto (ANTES|TROMPETA|PLASTICO); en el nombre del
  // archivo las barras no sirven, pero en la base se guarda completo
  const enNombre = String(tipo).replace(/\|/g, "-");
  const ruta = `${item.coord}/${item.tkt||("id"+item.id)}/${Date.now()}_${enNombre}_${i}.${ext}`;
  // sin upsert: una evidencia nunca debe pisar a otra. Si la ruta ya existiera
  // —no deberia, lleva la hora al milisegundo— es mejor que falle y se reintente
  // que perder la foto anterior.
  const r = await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${ruta}`,
    {method:"POST", headers:Object.assign({},HDR,{"Content-Type":blob.type}),
     body:blob});
  if(!r.ok) throw new Error("storage "+r.status);
  await api("evidencias",{method:"POST",body:JSON.stringify({
    coord:item.coord, servicio_id:item.id, tkt:item.tkt||"", tipo:tipo,
    ruta:ruta, tecnico:item.tecnico})});
  return ruta;
}

async function enviarCierre(item){
  // primero las evidencias: si fallan, el TKT no debe quedar cerrado sin respaldo
  for(const [campo,tipo] of (item.campos||[])){
    const arr=item[campo]||[];
    for(let i=0;i<arr.length;i++) await subirArchivo(item, arr[i], tipo, i);
  }
  for(const p of (item.partidas||[])) await subirArchivo(item, p.blob, p.tipo, p.n);
  if(Object.keys(item.body||{}).length){
    await api(`servicios?coord=eq.${encodeURIComponent(item.coord)}&id=eq.${item.id}`,
              {method:"PATCH", body:JSON.stringify(item.body)});
  }

  // al dar la obra por terminada, los días que quedaban programados se cancelan
  // (solo los que nadie ha tocado, para no borrar trabajo registrado)
  if(item.modo==="FIN_OBRA" && item.obra){
    await api("servicios?obra=eq."+encodeURIComponent(item.obra)+
              "&dia_n=gt."+item.dia_n+"&status=eq.PROGRAMADO",
      {method:"PATCH", body:JSON.stringify({status:"CANCELADO",
        obs_coord:"Obra terminada el "+fecha+" en el día "+item.dia_n})});
  }

  await api("log",{method:"POST",body:JSON.stringify({
    timestamp:item.ts, usuario:item.tecnico, win_user:"app", coord:item.coord,
    rol:"TECNICO", etapa:"4", tkt:item.tkt||"",
    accion:"APP: "+(item.modo||item.body.status),
    detalle:"id="+item.id+(item.obra?" · "+item.obra+" dia "+item.dia_n:"")+" · "+
            (item.campos||[]).map(([c,t])=>t.toLowerCase()+"="+(item[c]||[]).length).join(" ")+
            (item.nota?" · "+item.nota:"")})});
}

async function guardarCierre(s, modo, com){
  /* cada modo escribe distinto: el día que avanza queda en continuidad, el que
     no se pudo también pero marcado para cobro, y solo el cierre de la obra
     queda atendido */
  const body={};
  if(modo==="REGULARIZAR"){
    /* ni status ni fecha_atencion: el servicio ya estaba cerrado y su fecha es
       la que fue. Lo único que puede enriquecerse es el inventario. */
  }else if(modo==="ATENDIDO" || modo==="FIN_OBRA"){
    body.status="ATENDIDO"; body.fecha_atencion=fecha;
  }else if(modo==="CONTINUIDAD"){
    body.status="CONTINUIDAD"; body.fecha_atencion=fecha;
  }else{
    body.status=modo;
  }
  if(com) body.obs_coord=com;
  if(cie.log && cie.log.estado){
    body.log_estado = cie.log.estado;
    body.log_saltos = cie.log.estado==="SALTEADO" ? (cie.log.saltos||"") : "";
    if((cie.log.ultimo||"").trim()) body.log_ultimo = cie.log.ultimo.trim();
    if((cie.log.canal||"").toString().trim()) body.canal = cie.log.canal.toString().trim();
    const b = parseInt(cie.log.barras, 10);
    if(!isNaN(b)) body.senal_barras = b;
  }
  const item={id:s.id, coord:s.coord, tkt:s.tkt||"", body:body, nota:com, modo:modo,
              obra:s.obra||"", dia_n:s.dia_n||0,
              tecnico:tecnico, ts:new Date().toISOString().slice(0,19).replace("T"," ")};
  item.campos = cie._bloques.map(b=>[b.campo, b.tipo]);
  cie._bloques.forEach(b=>{ item[b.campo]=cie[b.campo].map(f=>f.blob) });
  /* el inventario: cada foto viaja sabiendo de que pieza es —el informe la
     titula con eso— y el conteo se escribe en el servicio, que es el dato que
     hasta hoy se capturaba a mano */
  if(cie.partidas){
    item.partidas = [];
    for(const etapa of ETAPAS_PART){
      if(!cie.partidas[etapa]) continue;
      for(const p of PARTIDAS){
        cie.partidas[etapa][p.id].forEach((f,i)=>{
          item.partidas.push({
            tipo: etapa+"|"+p.id+(f.variante?"|"+f.variante.toUpperCase():""),
            blob: f.blob, n: i+1});
        });
      }
    }
    Object.assign(body, conteoPartidas());
  }
  const listos={ATENDIDO:"Servicio cerrado ✓", FIN_OBRA:"Instalación concluida ✓",
                CONTINUIDAD:"Avance guardado · la obra sigue abierta ✓",
                REPROGRAMADO:"Reprogramado ✓"};
  try{
    await enviarCierre(item);
    toast(listos[modo]||"Guardado ✓");
    cerrarHoja(); cargar();
  }catch(e){
    try{
      await colaAdd(item);
      s.status=body.status;
      if(body.fecha_atencion){
        s.fecha_atencion=fecha;
        s._ev=s._ev||{};
        (item.campos||[]).forEach(([c,t])=>{ if((item[c]||[]).length) s._ev[t]=true });
      }
      if(com) s.obs_coord=com;
      toast("Sin señal · se guardó con sus fotos y subirá solo",true);
      cerrarHoja(); pintarDias(); pintar(); pintarPendientes();
    }catch(e2){
      toast("No se pudo guardar: "+String(e2).slice(0,60),true);
      const b=document.getElementById("btnGo");
      if(b){ b.disabled=false; b.textContent="Reintentar" }
    }
  }
}

/* ============ cola sin señal (IndexedDB: guarda las fotos completas) ============ */
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("mdcontrol",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("cola",{keyPath:"key",autoIncrement:true}) };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function colaAdd(item){
  const db=await idb();
  return new Promise((res,rej)=>{
    const t=db.transaction("cola","readwrite");
    t.objectStore("cola").add(item);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);
  });
}
async function colaTodo(){
  const db=await idb();
  return new Promise((res,rej)=>{
    const q=db.transaction("cola","readonly").objectStore("cola").getAll();
    q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
  });
}
async function colaQuita(key){
  const db=await idb();
  return new Promise((res)=>{
    const t=db.transaction("cola","readwrite");
    t.objectStore("cola").delete(key); t.oncomplete=()=>res();
  });
}

async function pintarPendientes(){
  let n=0; try{ n=(await colaTodo()).length }catch(e){}
  const el=document.getElementById("cola");
  el.style.display = n?"block":"none";
  if(n) el.textContent="⏳ "+n+" cierre(s) esperando señal · se suben solos";
}

let sincronizando=false;
async function sincronizar(avisar){
  if(sincronizando) return; sincronizando=true;
  try{
    const items=await colaTodo();
    let subidos=0;
    for(const it of items){
      try{ await enviarCierre(it); await colaQuita(it.key); subidos++ }catch(e){}
    }
    if(subidos){
      if(avisar) toast(subidos+" cierre(s) pendientes ya subieron ✓");
      await cargar();
    }
    await pintarPendientes();
  } finally { sincronizando=false }
}

/* ============ arranque ============ */
window.addEventListener("online", ()=>sincronizar(true));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sincronizar(true) });
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});

async function arrancarSesion(){
  pintarDias();
  // los alias pueden haber cambiado desde la ultima vez; si no hay red se usan
  // los que quedaron guardados en el telefono
  try{ await cargarVariantes() }catch(e){}
  await cargar();
  sincronizar(false);
}

(async function(){
  pintarPendientes();
  if(!ses){
    document.getElementById("mTec").style.display="flex";
    llenarUsuarios();
    return;
  }
  if(ses.rol==="ADMINISTRATIVO"){ location.href="entregables.html"; return }
  tecnico = ses.nombre || tecnico;
  await renovar();            // el token guardado casi siempre ya vencio
  await arrancarSesion();
})();
