<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B2038">
<title>MD Control · Levantamientos</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0B2038; --bg2:#0E2A47; --card:#12314F; --line:#1D4267;
    --txt:#EAF2FB; --txt2:#9DB6D2; --txt3:#6E8CAD;
    --acc:#63B3FF; --ok:#1E8E5A; --warn:#E8A33D; --bad:#C6413B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);line-height:1.45;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0B2038,#0E2A47);
    border-bottom:1px solid var(--line);padding:12px 16px;margin:0 -16px 14px}
  .brand{display:flex;align-items:center;gap:11px;max-width:1180px;margin:0 auto}
  .bt{font-size:17px;font-weight:800}
  .bs{font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.05em}
  .who{margin-left:auto;text-align:right;font-size:11px;color:var(--txt2);cursor:pointer}
  .who b{display:block;color:var(--txt);font-size:12px}

  .filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .f{display:flex;flex-direction:column;gap:4px}
  .f label{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em}
  select,input,textarea{padding:9px 10px;border-radius:10px;background:#0F2C4A;color:var(--txt);
    border:1px solid var(--line);font:inherit;font-size:13px}
  button{font:inherit;border:none;border-radius:10px;padding:10px 14px;font-size:13px;
    font-weight:700;cursor:pointer;background:#17456E;color:var(--acc)}
  button.pri{background:var(--acc);color:#07203a}
  button:disabled{opacity:.45;cursor:default}
  .mini{padding:5px 10px;font-size:11.5px}

  /* ---- cinta de cumplimiento ---- */
  .cinta{display:flex;align-items:center;gap:11px;flex-wrap:wrap;border-radius:12px;
    padding:10px 14px;margin-bottom:13px;font-size:13px;border:1px solid}
  .cinta.verde{background:rgba(30,142,90,.13);border-color:rgba(30,142,90,.45);color:#9EE7C2}
  .cinta.ambar{background:rgba(232,163,61,.11);border-color:rgba(232,163,61,.45);color:#F5CE93}
  .cinta.rojo{background:rgba(198,65,59,.12);border-color:rgba(198,65,59,.45);color:#F3B0AC}
  .cinta .foco{font-size:19px;line-height:1}
  .cinta b{font-weight:800}
  .cinta .det{color:var(--txt2);font-size:12px}
  .cinta a{margin-left:auto;color:inherit;font-weight:700;text-decoration:none;
    border-bottom:1px dotted currentColor;font-size:12.5px}
  .resumen{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:8px 14px;font-size:12px}
  .pill b{font-size:17px;display:block}

  .lev{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:11px}
  .lev-cab{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .lev-cab h3{margin:0;font-size:15.5px}
  .lev-sub{font-size:12px;color:var(--txt2);margin-top:2px}
  .lev-cab .der{margin-left:auto;display:flex;gap:7px}
  .tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:#17456E;color:var(--acc);white-space:nowrap}
  .tag.no{background:rgba(232,163,61,.15);color:#F0BE6E}

  .comp{overflow-x:auto;margin-top:12px}
  .comp table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
  .comp th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--txt2);padding:7px 9px;border-bottom:1px solid var(--line)}
  .comp th.p{color:var(--acc);font-size:13px;text-transform:none;letter-spacing:0}
  .comp td{padding:6px 9px;border-bottom:1px solid rgba(29,66,103,.45)}
  .comp td.et{color:var(--txt2);width:40%}
  .comp .tot{background:rgba(99,179,255,.10);font-weight:800}
  .comp .n{font-variant-numeric:tabular-nums;font-weight:700}

  .vacio{text-align:center;color:var(--txt2);padding:50px}
  .load{text-align:center;color:var(--txt2);padding:36px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(5,16,28,.95);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;
    padding:20px;max-width:390px;width:100%}
  .box h2{margin:0 0 3px;font-size:17px}
  .box p{margin:0 0 14px;font-size:12.5px;color:var(--txt2)}
  .box input{width:100%;margin-bottom:11px}
  .q{font-size:12px;color:var(--txt2)}
  /* la tabla de edicion: campos angostos, que quepan varias areas de frente */
  #edCuerpo input{padding:5px 7px;font-size:12.5px}
  .aviso{background:rgba(198,65,59,.14);border:1px solid rgba(198,65,59,.4);color:#F0A9A5;
    border-radius:10px;padding:9px 11px;font-size:12px;margin-bottom:11px}

  /* ---------- la ficha que se imprime ---------- */
  #salida{display:none}
  @media print{
    /* que el PDF salga igual a lo que se ve: sin esto el navegador
       imprime en blanco los encabezados azules y los recuadros */
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
    body{background:#fff;color:#000}
    header,.filtros,.resumen,#lista,.modal{display:none !important}
    #salida{display:block !important}
    .wrap{padding:0;max-width:none}
  }
  /* carta vertical, como los informes que firma la empresa */
  @page{size:letter portrait;margin:0}
  #salida .hoja{position:relative;page-break-after:always;padding:24mm 18mm;
    width:216mm;height:279mm;box-sizing:border-box;overflow:hidden;
    font-family:Calibri,Carlito,"Segoe UI",sans-serif;color:#111}
  #salida .hoja:last-child{page-break-after:auto}
  #salida .marca img{height:46px}
  #salida h1{font-size:17px;margin:14mm 0 2mm;text-align:center}
  #salida .sitio{font-size:20px;font-weight:800;text-align:center;margin:0 0 2mm}
  #salida .dir{font-size:11.5px;text-align:center;color:#333;margin-bottom:9mm}
  #salida table.f{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:7mm}
  #salida table.f th{background:#1F3864;color:#fff;padding:5px 7px;text-align:left;
    border:1px solid #7d8fa8}
  #salida table.f td{border:1px solid #9aa7b8;padding:4px 7px}
  #salida table.f td.et{width:38%;color:#333}
  #salida .pie{position:absolute;left:18mm;right:18mm;bottom:10mm;text-align:center;
    font-size:9px;color:#3b3b3b;border-top:2px solid #1F3864;padding-top:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 100 100"><path d="M50 8 L92 88 L8 88 Z" fill="none" stroke="#63B3FF" stroke-width="11" stroke-linejoin="round"/></svg>
      <div><div class="bt">MD Control</div><div class="bs">LEVANTAMIENTOS</div></div>
      <div class="who" id="who" onclick="salir()"></div>
    </div>
  </header>

  <div id="cinta"></div>

  <div class="filtros" id="filtros" style="display:none">
    <div class="f"><label>Cliente</label>
      <select id="fCli" onchange="pintar()"><option value="">Todos</option></select></div>
    <div class="f"><label>Desde</label><input type="date" id="fDe" onchange="cargar()"></div>
    <div class="f"><label>Hasta</label><input type="date" id="fA" onchange="cargar()"></div>
    <div class="f"><label>Propuesta</label>
      <select id="fProp" onchange="pintar()">
        <option value="">Todos</option>
        <option value="con">Ya levantados</option>
        <option value="comp">De varios equipos</option>
        <option value="sin">Sin capturar</option></select></div>
    <button class="pri" onclick="imprimirTodas()">Imprimir fichas</button>
  </div>

  <div class="resumen" id="resumen"></div>
  <div id="lista"><div class="load">Entra para ver tus levantamientos.</div></div>
</div>

<div id="salida"></div>

<!-- corregir y completar lo que capturó el técnico -->
<div class="modal" id="mEdit" style="display:none">
  <div class="box" style="max-width:1000px;max-height:92vh;overflow:auto">
    <h2 id="edSitio"></h2>
    <p id="edSub"></p>
    <p>Corrige cantidades o el nombre del área, y agrega la que falte. Es lo que
       va a ver el cliente en la ficha.</p>
    <div id="edCuerpo"></div>
    <div id="edAviso" style="margin-top:11px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:13px">
      <button onclick="agregarArea()">+ Agregar área</button>
      <button class="pri" id="edBtn" onclick="guardarEdicion()">Guardar cambios</button>
      <button style="margin-left:auto"
              onclick="document.getElementById('mEdit').style.display='none'">Cancelar</button>
    </div>
  </div>
</div>

<!-- cargar fotos de un levantamiento ya hecho, sin tocar el servicio -->
<div class="modal" id="mSubir" style="display:none">
  <div class="box">
    <h2>Agregar fotos</h2>
    <p><b id="subSitio"></b><br><span id="subFecha"></span></p>
    <label style="display:block;font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">¿Qué son?</label>
    <select id="subEtapa">
      <option value="LEVANTAMIENTO">Fotos del levantamiento</option>
      <option value="CROQUIS">Croquis de lo propuesto</option>
      <option value="REPORTE">Reporte firmado</option>
    </select>
    <label style="display:block;font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin:9px 0 4px">Archivos</label>
    <input id="subFile" type="file" accept="image/*,application/pdf" multiple>
    <div class="aviso" id="subErr" style="display:none"></div>
    <button class="pri" id="subBtn" style="width:100%;justify-content:center"
            onclick="guardarSubida()">Guardar</button>
    <button style="width:100%;justify-content:center;margin-top:8px"
            onclick="document.getElementById('mSubir').style.display='none'">Cancelar</button>
  </div>
</div>

<div class="modal" id="mLogin">
  <div class="box">
    <h2>Levantamientos</h2>
    <p>Entra con tu estación. Cada quien ve lo de su coordinación.</p>
    <select id="inUsr">
      <option value="est.jair">Jair · Levantamientos</option>
      <option value="est.gloria">Montserrat · Aux administrativo</option>
      <option value="est.gerencia">Gerencia</option>
      <option value="est.subgerencia">Subgerencia</option>
    </select>
    <input id="inPwd" type="password" placeholder="clave"
           onkeydown="if(event.key==='Enter')entrar()">
    <div class="aviso" id="err" style="display:none"></div>
    <button class="pri" style="width:100%;justify-content:center" onclick="entrar()">Entrar</button>
  </div>
</div>

<script>
const SUPA_URL="https://buwoxejgnmyvshwznbaj.supabase.co";
const SUPA_KEY="sb_publishable_Pts8K36Tj4vZ7UzSAwwicw_K6I11-Aw";
const DOMINIO="mdcontrol.local";
const LOGO="logo.png";

const LLAVES_SESION=["md_capt", "md_prog", "md_coord", "md_cierre", "md_cat", "md_lev", "md_sup", "md_ventas", "md_demanda", "md_ses", "md_web", "md_tec"];

/* ---------- la sesion guardada caduca ----------
   Antes no caducaba nunca: un equipo que nadie cerraba quedaba abierto para
   siempre, y quien lo tomara escribia con el nombre del dueno. Ahora se anota
   cuando se uso por ultima vez y a los 15 dias se pide la clave otra vez. */
const DIAS_SESION = 15;
function sesionVigente(s){
  if(!s) return null;
  if(s.visto && (Date.now() - s.visto) > DIAS_SESION*86400000) return null;
  return s;
}
function marcarUso(){
  try{
    if(!ses) return;
    ses.visto = Date.now();
    LLAVES_SESION.forEach(function(k){
      if(localStorage.getItem(k)) localStorage.setItem(k, JSON.stringify(ses));
    });
  }catch(e){}
}

let ses=sesionVigente(JSON.parse(localStorage.getItem("md_lev")||
  localStorage.getItem("md_web")||"null"))   /* la sesion es una sola: ver md_web abajo */;
let filas=[], props={};

function hdr(){ return {apikey:SUPA_KEY, Authorization:"Bearer "+((ses&&ses.token)||SUPA_KEY)} }
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function limpio(s){s=(s||"").trim();return /^(-+|n\/?a|na|s\/d|0)$/i.test(s)?"":s}
function llave(x){ return x.coord+"|"+x.id }

async function api(path,opts,reint){
  const o=opts||{};
  const r=await fetch(SUPA_URL+"/rest/v1/"+path,Object.assign({},o,{headers:hdr()}));
  const t=await r.text();
  if((r.status===401||r.status===403)&&!reint&&ses){ if(await renovar()) return api(path,opts,true) }
  if(!r.ok) throw new Error("HTTP "+r.status);
  return t?JSON.parse(t):null;
}
async function auth(cuerpo,tipo){
  const r=await fetch(SUPA_URL+"/auth/v1/token?grant_type="+tipo,
    {method:"POST",headers:{apikey:SUPA_KEY,"Content-Type":"application/json"},
     body:JSON.stringify(cuerpo)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg||j.error_description||("HTTP "+r.status));
  return j;
}
function guardar(j){
  ses={token:j.access_token, refresh:j.refresh_token,
       usuario:(j.user&&j.user.email||"").split("@")[0],
       rol:(j.user&&j.user.user_metadata&&j.user.user_metadata.rol)||"",
       coord:(j.user&&j.user.user_metadata&&j.user.user_metadata.coord)||""};
  localStorage.setItem("md_lev",JSON.stringify(ses));
  /* ---------- una sola sesion para todo ----------
     Cada pantalla guardaba su sesion aparte, asi que al pasar de
     supervision a captura la segunda no encontraba nada y volvia a
     pedir la clave, mostrando ademas el primer nombre de la lista.
     Ahora la sesion se escribe tambien en una llave comun y todas la
     leen: se entra una vez y se anda por las etapas sin teclear otra vez. */
  ses.visto = Date.now();
  localStorage.setItem("md_lev",JSON.stringify(ses));
  localStorage.setItem("md_web",JSON.stringify(ses));
}
async function renovar(){
  if(!ses||!ses.refresh) return false;
  try{ guardar(await auth({refresh_token:ses.refresh},"refresh_token")); return true }catch(e){ return false }
}
async function entrar(){
  const u=document.getElementById("inUsr").value.trim();
  const p=document.getElementById("inPwd").value;
  const e=document.getElementById("err");
  if(!u||!p){ e.textContent="Escribe usuario y clave"; e.style.display="block"; return }
  try{
    guardar(await auth({email:u+"@"+DOMINIO,password:p},"password"));
    localStorage.setItem("md_quien", u);
    document.getElementById("mLogin").style.display="none";
    arrancar();
  }catch(x){ e.textContent="No se pudo entrar: "+x.message; e.style.display="block" }
}
function salir(){
  /* Salir cierra en TODAS las pantallas, no solo en esta. Cada una guarda
     su propia copia de la sesion: si se borraba nada mas la de aqui, las
     otras seguian abiertas y al volver se entraba sin pedir la clave. */
  ["md_capt", "md_prog", "md_coord", "md_cierre", "md_cat", "md_lev", "md_sup", "md_ventas", "md_demanda", "md_ses", "md_web"]
    .forEach(function(k){ localStorage.removeItem(k) });
  location.reload();
}

const NOMBRE_EST={"est.jair":"Jair","est.gerencia":"Gerencia","est.subgerencia":"Subgerencia"};
async function arrancar(){
  document.getElementById("who").innerHTML=
    "<b>"+esc(NOMBRE_EST[ses.usuario]||ses.usuario||"")+"</b>salir";
  document.getElementById("filtros").style.display="flex";
  /* sin fechas de arranque: los levantamientos se retrasan y hay que poder
     llegar a los de hace un año. Quien quiera acotar, pone el rango. */
  cargar();
}

/* ---------- traer levantamientos y sus propuestas ---------- */
/* ---------- cinta de cumplimiento: lo comprometido que ya vencio ----------
   La meta que la base si registra es la FECHA DE SERVICIO. Un servicio con la
   fecha pasada y sin cerrar es una meta no cumplida, y eso es lo que se mide.
   No se usa `dias_est` porque casi nadie lo llena: 79 servicios de 5,925, y
   ninguno rebasa su plazo. Un semaforo sobre ese campo saldria verde siempre.

   El color lo decide la ANTIGUEDAD, no la cantidad: diez servicios de ayer se
   recuperan; uno de hace tres meses ya se perdio.
       verde  nada vencido
       ambar  hay vencidos, ninguno pasa de 30 dias
       rojo   alguno pasa de 30 dias
*/
const CIERRE_FUERA='(ATENDIDO,CANCELADO,PROSPECTO,"ATENCION VENTAS")';
async function _cuantosAtraso(filtro){
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/servicios?select=id"+filtro+"&limit=1",
      {headers:hdr({Prefer:"count=exact"})});
    const n=Number(String(r.headers.get("Content-Range")||"").split("/")[1]);
    return isNaN(n)?0:n;
  }catch(e){ return 0 }
}
function _hoyIso(){const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function _haceDias(n){const d=new Date(); d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

async function pintarCinta(){
  const c=document.getElementById("cinta");
  if(!c) return;
  const sel=document.getElementById("fCoord");
  const co=sel?sel.value:"";
  const dond=(co?"&coord=eq."+encodeURIComponent(co):"");
  const base="&status=not.in."+CIERRE_FUERA+dond;
  const vencidos=await _cuantosAtraso(base+"&fecha_servicio=lt."+_hoyIso());
  if(!vencidos){
    c.className="cinta verde";
    c.innerHTML='<span class="foco">●</span><b>Al día</b>'+
      '<span class="det">No hay servicios'+(co?" de "+esc(co):"")+
      ' con la fecha vencida y sin cerrar.</span>';
    return;
  }
  const graves=await _cuantosAtraso(base+"&fecha_servicio=lt."+_haceDias(30));
  const viejo =await api("servicios?select=fecha_servicio,nombre&status=not.in."+CIERRE_FUERA+
    dond+"&fecha_servicio=lt."+_hoyIso()+"&order=fecha_servicio.asc&limit=1");
  let dd=0, nom="";
  if(viejo && viejo.length){
    dd=Math.round((new Date(_hoyIso())-new Date(viejo[0].fecha_servicio))/86400000);
    nom=viejo[0].nombre||"";
  }
  c.className="cinta "+(graves?"rojo":"ambar");
  c.innerHTML='<span class="foco">●</span>'+
    '<b>'+vencidos+' servicio'+(vencidos>1?"s":"")+' con la fecha vencida</b>'+
    '<span class="det">'+(graves?graves+" con más de un mes. ":"")+
    (dd?"El más viejo lleva "+dd+" días: "+esc(nom.slice(0,34))+".":"")+'</span>'+
    '<a href="cierre.html">Ver y cerrar →</a>';
}

async function cargar(){
  document.getElementById("lista").innerHTML='<div class="load">Cargando…</div>';
  const de=document.getElementById("fDe").value, a=document.getElementById("fA").value;
  let q="servicios?select=id,coord,tkt,nombre,dependencia,direccion,fecha_servicio,"+
        "fecha_atencion,tecnico,tipo_inmueble,requerimientos,obs_coord,tiempo_inst_est,"+
        "segurista_vigia,status&coord=eq.LEV&order=fecha_atencion.desc,nombre";
  if(de) q+="&fecha_servicio=gte."+de;
  if(a)  q+="&fecha_servicio=lte."+a;
  try{
    filas=[];
    for(let off=0; off<8000; off+=1000){
      const t=await api(q+"&limit=1000&offset="+off);
      filas=filas.concat(t);
      if(t.length<1000) break;
      document.getElementById("lista").innerHTML=
        '<div class="load">Cargando… '+filas.length+' levantamientos</div>';
    }
    props={};
    if(filas.length){
      const ids=[...new Set(filas.map(f=>f.id))];
      for(let i=0;i<ids.length;i+=300){
        const p=await api("propuestas?select=*&coord=eq.LEV&servicio_id=in.("+
                          ids.slice(i,i+300).join(",")+")&order=n&limit=3000");
        p.forEach(x=>{ const k="LEV|"+x.servicio_id; (props[k]=props[k]||[]).push(x) });
      }
    }
    llenarClientes();
    pintar();
  }catch(e){
    document.getElementById("lista").innerHTML=
      '<div class="vacio">No se pudo consultar.<br>'+esc(String(e.message))+'</div>';
  }
}
function llenarClientes(){
  const set=[...new Set(filas.map(x=>(x.dependencia||"").trim()).filter(Boolean))].sort();
  const sel=document.getElementById("fCli"), v=sel.value;
  sel.innerHTML='<option value="">Todos</option>'+set.map(c=>`<option>${esc(c)}</option>`).join("");
  sel.value=v;
}

/* ---------- las sonorizaciones del inmueble ----------
   No son versiones de lo mismo: cada una es un equipo para un área distinta del
   predio. Lo que ocupa costos es el desglose por área y, sobre todo, el total. */
const RENGLONES=[
  ["equipo","Equipo receptor"],["amplificador","Amplificador"],["amplificador_cap","Capacidad"],
  ["antena","Antenas"],["plasticas","Trompetas plástico"],["aluminio","Trompetas aluminio"],
  ["eliptica","Dual elíptica"],["bocina_plafon","Bocinas de plafón"],["estrobo","Estrobos"],
  ["ups","UPS"],["coaxial","Coaxial (3 m)"],["pot","Cable POT (3 m)"],["ur","Cable UR (3 m)"],
  ["p_gruesa","Tubería gruesa (3 m)"],["p_delgada","Tubería delgada (3 m)"],["notas","Notas"]
];

const SUMABLES=["amplificador","plasticas","aluminio","eliptica","bocina_plafon","estrobo","ups",
                "antena","coaxial","pot","ur","p_gruesa","p_delgada"];

function suma(ps,k){
  const t=ps.reduce((a,p)=>a+(parseFloat(p[k])||0),0);
  return t ? String(t) : "";
}
function comparativa(ps){
  if(!ps.length) return "";
  const usados=RENGLONES.filter(([k])=>ps.some(p=>limpio(p[k])));
  if(!usados.length) return "";
  const varias=ps.length>1;
  return `<div class="comp"><table>
    <tr><th></th>${ps.map(p=>`<th class="p">${esc(p.nombre||("Área "+p.n))}</th>`).join("")}
      ${varias?`<th class="p tot">Total</th>`:""}</tr>
    ${usados.map(([k,et])=>`<tr><td class="et">${et}</td>
        ${ps.map(p=>`<td class="${k==="notas"?"":"n"}">${esc(limpio(p[k])||"—")}</td>`).join("")}
        ${varias?`<td class="n tot">${SUMABLES.includes(k)?esc(suma(ps,k)||"—"):"—"}</td>`:""}
      </tr>`).join("")}
  </table></div>`;
}

function pintar(){ pintarCinta();
  const cli=document.getElementById("fCli").value;
  const fp=document.getElementById("fProp").value;
  let v=filas.filter(x=>!cli||(x.dependencia||"").trim()===cli);
  if(fp==="con")  v=v.filter(x=>(props[llave(x)]||[]).length>0);
  if(fp==="comp") v=v.filter(x=>(props[llave(x)]||[]).length>1);
  if(fp==="sin")  v=v.filter(x=>!(props[llave(x)]||[]).length);

  const con=filas.filter(x=>(props[llave(x)]||[]).length>0).length;
  const equipos=filas.reduce((a,x)=>a+(props[llave(x)]||[]).length,0);
  document.getElementById("resumen").innerHTML=
    `<div class="pill"><b>${filas.length}</b>levantamientos</div>
     <div class="pill"><b style="color:#5BD79B">${con}</b>ya levantados</div>
     <div class="pill"><b style="color:#63B3FF">${equipos}</b>equipos por instalar</div>
     <div class="pill"><b style="color:#E8A33D">${filas.length-con}</b>sin capturar</div>`;

  if(!v.length){
    document.getElementById("lista").innerHTML='<div class="vacio">Nada con esos filtros.</div>';
    return;
  }
  document.getElementById("lista").innerHTML=v.map(x=>{
    const ps=props[llave(x)]||[];
    return `<div class="lev">
      <div class="lev-cab">
        <div>
          <h3>${esc(x.nombre||"(sin nombre)")}</h3>
          <div class="lev-sub">${esc(limpio(x.dependencia))}
            ${x.tkt?" · "+esc(x.tkt):""} · ${esc(x.fecha_atencion||x.fecha_servicio||"")}
            ${limpio(x.tecnico)?" · "+esc(x.tecnico):""}</div>
        </div>
        <div class="der">
          ${ps.length?`<span class="tag">${ps.length} equipo${ps.length>1?"s":""}</span>`
                     :`<span class="tag no">sin capturar</span>`}
          <button class="mini" onclick="abrirSubir('${x.coord}',${x.id})">+ fotos</button>
          <button class="mini" onclick="editar('${x.coord}',${x.id})">✎ Editar</button>
          ${ps.length?`<button class="mini" onclick="ficha('${x.coord}',${x.id})">Ficha</button>`:""}
        </div>
      </div>
      ${comparativa(ps)}
    </div>`;
  }).join("");
}

/* ---------- editar lo levantado ----------
   El técnico captura en campo, con el celular en una mano y la cinta en la
   otra: se le va una cantidad o pone el área como "1" en vez del nombre del
   edificio. Jair es quien arma la propuesta que ve el cliente, así que tiene
   que poder corregirla y completarla sin pedirle al técnico que regrese.

   Se puede además agregar un área que faltó: un predio grande se alerta por
   zonas y a veces se descubre en gabinete que falta una. */
let edit=null;
function editar(coord,id){
  edit={x:filas.find(s=>s.coord===coord&&s.id===id),
        ps:JSON.parse(JSON.stringify(props[coord+"|"+id]||[]))};
  pintarEditor();
  document.getElementById("mEdit").style.display="flex";
}
function pintarEditor(){
  const x=edit.x, ps=edit.ps;
  document.getElementById("edSitio").textContent=x.nombre||"";
  document.getElementById("edSub").textContent=
    (limpio(x.dependencia)||"")+(x.tkt?" · TKT "+x.tkt:"")+" · "+(x.fecha_atencion||x.fecha_servicio||"");
  document.getElementById("edCuerpo").innerHTML=`
    <div class="comp"><table><tr><th></th>
      ${ps.map((p,j)=>`<th class="p">
        <input value="${esc(p.nombre||"")}" placeholder="Área ${p.n}"
               oninput="edit.ps[${j}].nombre=this.value" style="width:100%">
        <button class="mini" style="margin-top:5px"
                onclick="quitarArea(${j})">quitar</button></th>`).join("")}
      </tr>
      ${RENGLONES.map(([k,et])=>`<tr><td class="et">${et}</td>
        ${ps.map((p,j)=>`<td><input value="${esc(p[k]==null?"":p[k])}"
           oninput="edit.ps[${j}]['${k}']=this.value" style="width:100%"></td>`).join("")}
      </tr>`).join("")}
    </table></div>
    ${ps.length?"":'<div class="q" style="margin-top:10px">Todavía no hay áreas capturadas. Agrega la primera.</div>'}`;
}
function agregarArea(){
  const n=(edit.ps.reduce((a,p)=>Math.max(a,Number(p.n)||0),0))+1;
  edit.ps.push({coord:edit.x.coord, servicio_id:edit.x.id, n:n, nombre:"", notas:""});
  pintarEditor();
}
function quitarArea(j){
  if(!confirm("¿Quitar esa área de la propuesta?")) return;
  edit.ps.splice(j,1);
  pintarEditor();
}
const ETAPA_AQUI=4;

/* ---------- bitacora: quien movio que ----------
   Es el mismo LOG que llevaba la estacion de Excel (LogSupa). Al pasar a web se
   habia quedado sin anotar, y con la gente migrando el rastro se perdia.

   Se manda sin esperar y con el error tragado a proposito: si la bitacora
   falla, el trabajo del usuario ya quedo guardado y no tiene por que enterarse.
   Un log que estorba se acaba quitando. */
function anotar(accion, detalle, x){
  try{
    const t=new Date();
    const p=n=>String(n).padStart(2,"0");
    api("log",{method:"POST", headers:{Prefer:"return=minimal"}, body:JSON.stringify({
      timestamp:t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+" "+
                p(t.getHours())+":"+p(t.getMinutes())+":"+p(t.getSeconds()),
      usuario:nombreDe(ses&&ses.usuario), win_user:"web",
      coord:(x&&x.coord)||(ses&&ses.coord)||"", rol:(ses&&ses.rol)||"",
      etapa:String((x&&x.etapa_actual)||ETAPA_AQUI),
      tkt:(x&&x.tkt)||"", accion:accion, detalle:detalle||""
    })}).catch(function(){});
  }catch(e){}
}

async function guardarEdicion(){
  const b=document.getElementById("edBtn"), av=document.getElementById("edAviso");
  const x=edit.x, antes=props[x.coord+"|"+x.id]||[];
  b.disabled=true; b.textContent="Guardando…"; av.innerHTML="";
  try{
    // lo que se quitó en pantalla se quita en la base
    const quedan=edit.ps.map(p=>Number(p.n));
    for(const p of antes){
      if(quedan.indexOf(Number(p.n))<0)
        await api(`propuestas?coord=eq.${encodeURIComponent(x.coord)}`+
                  `&servicio_id=eq.${x.id}&n=eq.${p.n}`,{method:"DELETE"});
    }
    for(const p of edit.ps){
      const fila=Object.assign({}, p, {coord:x.coord, servicio_id:x.id,
                                       capturo:nombreDe(ses.usuario)});
      delete fila.id;
      await api("propuestas?on_conflict=coord,servicio_id,n",
        {method:"POST", headers:{Prefer:"resolution=merge-duplicates"},
         body:JSON.stringify(fila)});
    }
    anotar("PROPUESTAS", "ID="+x.id+" · "+edit.ps.length+" áreas", x);
    props[x.coord+"|"+x.id]=edit.ps;
    document.getElementById("mEdit").style.display="none";
    pintar();
  }catch(e){
    av.innerHTML='<div class="aviso">No se pudo guardar: '+esc(String(e).slice(0,140))+'</div>';
  }
  b.disabled=false; b.textContent="Guardar cambios";
}
function nombreDe(u){
  return ({"est.jair":"Jair","est.gloria":"Montserrat","est.gerencia":"Gerencia",
           "est.subgerencia":"Subgerencia"})[u] || u;
}

/* ---------- subir fotos de levantamientos pasados ----------
   Los levantamientos se retrasan y el material llega despues, a veces por
   correo. Se carga aqui sin tocar el servicio: ya esta atendido. */
let subir=null;
function abrirSubir(coord,id){
  const x=filas.find(s=>s.coord===coord&&s.id===id); if(!x) return;
  subir={coord:coord,id:id,srv:x};
  document.getElementById("subSitio").textContent=(x.nombre||"")+(x.tkt?" · "+x.tkt:"");
  document.getElementById("subFecha").textContent=
    "Levantado el "+(x.fecha_atencion||x.fecha_servicio||"—")+" · "+(limpio(x.tecnico)||"sin técnico");
  document.getElementById("subErr").style.display="none";
  document.getElementById("subFile").value="";
  document.getElementById("mSubir").style.display="flex";
}
async function guardarSubida(){
  const inp=document.getElementById("subFile"), err=document.getElementById("subErr");
  const btn=document.getElementById("subBtn");
  if(!inp.files.length){ err.textContent="Elige al menos un archivo"; err.style.display="block"; return }
  const tipo=document.getElementById("subEtapa").value, x=subir.srv;
  btn.disabled=true;
  try{
    for(let i=0;i<inp.files.length;i++){
      btn.textContent=`Subiendo ${i+1}/${inp.files.length}…`;
      const f=inp.files[i];
      const ext=f.type==="application/pdf"?"pdf":"jpg";
      const ruta=`${x.coord}/${x.tkt||("id"+x.id)}/${Date.now()}_${tipo}_${i}.${ext}`;
      const r=await fetch(`${SUPA_URL}/storage/v1/object/evidencias/${ruta}`,
        {method:"POST",headers:Object.assign({},hdr(),{"Content-Type":f.type||"image/jpeg"}),body:f});
      if(!r.ok) throw new Error("no se pudo guardar ("+r.status+")");
      await api("evidencias",{method:"POST",
        headers:{"Content-Type":"application/json",Prefer:"return=minimal"},
        body:JSON.stringify({coord:x.coord,servicio_id:x.id,tkt:x.tkt||"",tipo:tipo,
                             ruta:ruta,tecnico:x.tecnico||ses.usuario})});
    }
    document.getElementById("mSubir").style.display="none";
  }catch(e){ err.textContent=e.message; err.style.display="block" }
  finally{ btn.disabled=false; btn.textContent="Guardar" }
}

/* ---------- ficha para el cliente ---------- */
function hojaFicha(x, ps){
  const usados=RENGLONES.filter(([k])=>ps.some(p=>limpio(p[k])));
  return `<div class="hoja">
    <div class="marca"><img src="${LOGO}"></div>
    <h1>Propuesta de instalación del sistema de alerta sísmica</h1>
    <div class="sitio">${esc((x.nombre||"").toUpperCase())}</div>
    <div class="dir">${esc(limpio(x.direccion))}</div>
    <table class="f">
      <tr><td class="et">Cliente</td><td>${esc(limpio(x.dependencia))}</td></tr>
      <tr><td class="et">Levantamiento</td><td>${esc(x.fecha_atencion||x.fecha_servicio||"")}</td></tr>
      <tr><td class="et">Realizó</td><td>${esc(limpio(x.tecnico))}</td></tr>
      ${limpio(x.tipo_inmueble)?`<tr><td class="et">Tipo de inmueble</td><td>${esc(x.tipo_inmueble)}</td></tr>`:""}
      ${limpio(x.segurista_vigia)?`<tr><td class="et">Requiere segurista o vigía</td><td>${esc(x.segurista_vigia)}</td></tr>`:""}
      ${limpio(x.tiempo_inst_est)?`<tr><td class="et">Tiempo estimado de instalación</td><td>${esc(x.tiempo_inst_est)} min</td></tr>`:""}
    </table>
    <p style="font-size:11.5px;margin:0 0 3mm"><b>${ps.length}</b>
      ${ps.length===1?"equipo necesario":"equipos necesarios"} para alertar a todo el inmueble.</p>
    <table class="f">
      <tr><th></th>${ps.map(p=>`<th>${esc(p.nombre||("Área "+p.n))}</th>`).join("")}
        ${ps.length>1?`<th>Total</th>`:""}</tr>
      ${usados.map(([k,et])=>`<tr><td class="et">${et}</td>
        ${ps.map(p=>`<td>${esc(limpio(p[k])||"—")}</td>`).join("")}
        ${ps.length>1?`<td><b>${SUMABLES.includes(k)?esc(suma(ps,k)||"—"):"—"}</b></td>`:""}</tr>`).join("")}
    </table>
    ${limpio(x.requerimientos)?`<p style="font-size:11.5px"><b>Requerimientos:</b> ${esc(x.requerimientos)}</p>`:""}
    <div class="pie">Magdalena 202, Col. Del Valle, Benito Juárez, C.P. 03100, CDMX, Tel. 551107 8307<br>
      www.mdreieck.com.mx</div>
  </div>`;
}
function ficha(coord,id){
  const x=filas.find(s=>s.coord===coord&&s.id===id);
  const ps=props[llave(x)]||[];
  document.getElementById("salida").innerHTML=hojaFicha(x,ps);
  setTimeout(()=>window.print(),300);
}
function imprimirTodas(){
  const cli=document.getElementById("fCli").value;
  const fp=document.getElementById("fProp").value;
  let v=filas.filter(x=>!cli||(x.dependencia||"").trim()===cli);
  if(fp==="con")  v=v.filter(x=>(props[llave(x)]||[]).length>0);
  if(fp==="comp") v=v.filter(x=>(props[llave(x)]||[]).length>1);
  v=v.filter(x=>(props[llave(x)]||[]).length);
  if(!v.length){ alert("No hay levantamientos con propuesta en lo que estás viendo."); return }
  document.getElementById("salida").innerHTML=v.map(x=>hojaFicha(x,props[llave(x)])).join("");
  setTimeout(()=>window.print(),400);
}

(async function(){
  /* Si hay sesion guardada se entra derecho; pero si ya no sirve hay que
     volver a pedir la clave. Antes se escondia el recuadro ANTES de saber si
     la sesion valia: cuando estaba vencida, la pantalla se quedaba cargando
     para siempre y sin manera de entrar. Le pasaba a quien ya habia abierto
     antes; a uno recien llegado no, porque ese si veia el recuadro. */
  if(ses){
    let sirve = await renovar();
    if(!sirve){
      /* el refresco pudo fallar por la red, no por la sesion: se prueba el
         pase que ya se tenia antes de correr a nadie */
      try{ await api("servicios?select=id&limit=1"); sirve = true; }
      catch(e){ sirve = false; }
    }
    if(sirve){
      document.getElementById("mLogin").style.display="none";
      arrancar();
    }else{
      localStorage.removeItem("md_lev");
      localStorage.removeItem("md_web");
      ses = null;
      const e=document.getElementById("err");
      if(e){ e.textContent="Tu sesion vencio. Vuelve a entrar con tu clave.";
             e.style.display="block"; }
    }
  }
})();

/* ---------- que no salga siempre el primero de la lista ----------
   El menu se quedaba en la primera opcion, y esa es Jenifer: todos veian su
   nombre al entrar. Ahora se preselecciona quien uso esta pantalla la ultima vez
   en este equipo, o a quien se eligio en el inicio. Es solo comodidad: la clave
   se sigue pidiendo igual. */
function recordarQuien(){
  const sel=document.getElementById("inUsr");
  if(!sel) return;
  const u=localStorage.getItem("md_quien");
  if(u && sel.querySelector('option[value="'+u+'"]')) sel.value=u;
}
try{ recordarQuien(); }catch(e){}
